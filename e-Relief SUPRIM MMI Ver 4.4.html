<!DOCTYPE html>
<html lang="ms" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Relief MMI - Pengurusan Guru Ganti Sekolah</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & React DOM Babel CDN for single-file React App -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; font-size: 10px !important; }
            .print-break-inside-avoid { break-inside: avoid; }
            /* Styling khas untuk One Page Report pada cetakan A4 */
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
            #printableReport {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="h-full text-slate-800">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- MOCK INITIAL DATA ---
        const INITIAL_SCHOOL_INFO = {
            name: "SEKOLAH KEBANGSAAN SERI PERDANA",
            code: "BBA1234",
            address: "Jalan Educity, 43000 Kajang, Selangor",
            phone: "03-89251000",
            email: "bba1234@moe.edu.my",
            category: "Sekolah Bandar",
            enrolment: 450,
            location: "Bandar",
            headmaster: "Dr. Azman bin Mahmud",
            pkAdmin: "Puan Noraini binti Hamid",
            pkHem: "Encik Razali bin Ismail",
            pkKoko: "Puan Siti Zubaidah binti Yaacob",
            coordinator: "Encik Amirul Hafiz bin Zainal",
            adminPassword: "admin123",
            badgeBase64: ""
        };

        const INITIAL_TEACHERS = [
            { id: "T101", name: "Ahmad Bin Abdullah", shortName: "AHMAD", phone: "60123456789", option: "Bahasa Melayu", otherSubjects: "Sejarah, Pendidikan Moral", maxRelief: 8, status: "Aktif" },
            { id: "T102", name: "Siti Fatimah Binti Ismail", shortName: "FATIMAH", phone: "60198765432", option: "Matematik", otherSubjects: "Sains, RBT", maxRelief: 8, status: "Aktif" },
            { id: "T103", name: "Lim Wei Sheng", shortName: "WS LIM", phone: "60171122334", option: "Sains", otherSubjects: "Matematik", maxRelief: 8, status: "Aktif" },
            { id: "T104", name: "Kavitha A/P Muthu", shortName: "KAVITHA", phone: "60165544332", option: "Bahasa Inggeris", otherSubjects: "Pendidikan Seni Visual", maxRelief: 8, status: "Aktif" },
            { id: "T105", name: "Zulkifli Bin Mansor", shortName: "ZULKIFLI", phone: "60139988776", option: "Pendidikan Islam", otherSubjects: "Bahasa Arab", maxRelief: 8, status: "Aktif" },
            { id: "T106", name: "Norazlina Binti Kassim", shortName: "NORAZLINA", phone: "60142233445", option: "Prasekolah", otherSubjects: "-", maxRelief: 0, status: "Aktif (Prasekolah)" },
            { id: "T107", name: "Chong Kah Wai", shortName: "KW CHONG", phone: "60112233445", option: "Sejarah", otherSubjects: "Geografi, RBT", maxRelief: 8, status: "Aktif" },
            { id: "T108", name: "Nurul Aini Binti Hashim", shortName: "AINI", phone: "60183344556", option: "RBT", otherSubjects: "Sains", maxRelief: 8, status: "Aktif" }
        ];

        const INITIAL_SCHEDULE = [
            { day: "Isnin", timeSlot: "08:00 - 08:30", slotNum: "Masa 2", class: "1 Ibnu Sina", subject: "Bahasa Melayu", teacher: "Ahmad Bin Abdullah", domain: "Perdana" },
            { day: "Isnin", timeSlot: "08:30 - 09:00", slotNum: "Masa 3", class: "4 Gemilang", subject: "Matematik", teacher: "Siti Fatimah Binti Ismail", domain: "Perdana" },
            { day: "Isnin", timeSlot: "09:00 - 09:30", slotNum: "Masa 4", class: "3 Maju", subject: "Sains", teacher: "Lim Wei Sheng", domain: "Perdana" },
            { day: "Isnin", timeSlot: "10:00 - 10:30", slotNum: "Masa 5", class: "1 Ibnu Sina", subject: "Bahasa Inggeris", teacher: "Kavitha A/P Muthu", domain: "Perdana" },
            { day: "Isnin", timeSlot: "10:30 - 11:00", slotNum: "Masa 6", class: "5 Cemerlang", subject: "Pendidikan Islam", teacher: "Zulkifli Bin Mansor", domain: "Pemulihan" }
        ];

        // Main Application Component
        function App() {
            // States with localStorage Backup
            const [activeTab, setActiveTab] = useState('dashboard');
            const [schoolInfo, setSchoolInfo] = useState(() => {
                const saved = localStorage.getItem('mmi_school_info');
                return saved ? JSON.parse(saved) : INITIAL_SCHOOL_INFO;
            });
            const [teachers, setTeachers] = useState(() => {
                const saved = localStorage.getItem('mmi_teachers');
                return saved ? JSON.parse(saved) : INITIAL_TEACHERS;
            });
            const [absences, setAbsences] = useState(() => {
                const saved = localStorage.getItem('mmi_absences');
                return saved ? JSON.parse(saved) : [];
            });
            const [masterSchedule, setMasterSchedule] = useState(() => {
                const saved = localStorage.getItem('mmi_master_schedule');
                return saved ? JSON.parse(saved) : INITIAL_SCHEDULE;
            });
            const [reliefs, setReliefs] = useState(() => {
                const saved = localStorage.getItem('mmi_reliefs');
                return saved ? JSON.parse(saved) : [];
            });

            // Shared Global Date State for Today Sync
            const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);
            const [selectedGlobalDate, setSelectedGlobalDate] = useState(todayStr);

            const handleSetTodayGlobal = () => {
                setSelectedGlobalDate(todayStr);
            };

            // Password Modal State
            const [showResetModal, setShowResetModal] = useState(false);
            const [resetType, setResetType] = useState('all');
            const [inputPassword, setInputPassword] = useState('');
            const [passwordError, setPasswordError] = useState('');

            // Print Slip Modal State
            const [printSlipData, setPrintSlipData] = useState(null);

            // Bulk WhatsApp Modal State
            const [showBulkWhatsAppModal, setShowBulkWhatsAppModal] = useState(false);

            // Sync with LocalStorage
            useEffect(() => { localStorage.setItem('mmi_school_info', JSON.stringify(schoolInfo)); }, [schoolInfo]);
            useEffect(() => { localStorage.setItem('mmi_teachers', JSON.stringify(teachers)); }, [teachers]);
            useEffect(() => { localStorage.setItem('mmi_absences', JSON.stringify(absences)); }, [absences]);
            useEffect(() => { localStorage.setItem('mmi_master_schedule', JSON.stringify(masterSchedule)); }, [masterSchedule]);
            useEffect(() => { localStorage.setItem('mmi_reliefs', JSON.stringify(reliefs)); }, [reliefs]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, reliefs, absences, teachers, showResetModal, printSlipData, showBulkWhatsAppModal]);

            // Execute Delete/Reset after Password Check
            const handleExecuteReset = () => {
                const correctPassword = schoolInfo.adminPassword || "admin123";
                if (inputPassword !== correctPassword) {
                    setPasswordError("Kata laluan Admin tidak sah!");
                    return;
                }

                if (resetType === 'all') {
                    setTeachers([]);
                    setAbsences([]);
                    setReliefs([]);
                    setMasterSchedule([]);
                } else if (resetType === 'teachers') {
                    setTeachers([]);
                } else if (resetType === 'absences') {
                    setAbsences([]);
                } else if (resetType === 'reliefs') {
                    // ARAHAN KHAS: Hanya padam rekod relief pada tarikh semasa sahaja
                    setReliefs(prevReliefs => prevReliefs.filter(r => r.date !== selectedGlobalDate));
                } else if (resetType === 'schedule') {
                    setMasterSchedule([]);
                }

                setShowResetModal(false);
                setInputPassword('');
                setPasswordError('');
                alert('Tindakan pembersihan data berjaya dilaksanakan!');
            };

            const triggerResetModal = (type) => {
                setResetType(type);
                setInputPassword('');
                setPasswordError('');
                setShowResetModal(true);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Header Utama */}
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30 border-b border-slate-800 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-20">
                                <div className="flex items-center gap-4">
                                    {schoolInfo.badgeBase64 ? (
                                        <img src={schoolInfo.badgeBase64} alt="Lencana" className="w-12 h-12 object-contain bg-white/10 rounded-lg p-1 border border-white/20" />
                                    ) : (
                                        <div className="w-12 h-12 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-inner border border-indigo-400">
                                            MMI
                                        </div>
                                    )}
                                    <div>
                                        <h1 className="text-lg font-bold tracking-tight text-white sm:text-xl flex items-center gap-2">
                                            e-Relief MMI <span className="text-xs bg-indigo-500/30 text-indigo-300 border border-indigo-500/50 px-2 py-0.5 rounded-full font-semibold">Sekolah</span>
                                        </h1>
                                        <p className="text-xs text-slate-400">{schoolInfo.name || "Sistem Pengurusan Guru Ganti"}</p>
                                    </div>
                                </div>
                                <div className="hidden md:flex items-center gap-3 text-right">
                                    <div className="text-xs text-slate-300">
                                        <div className="font-semibold">{new Date().toLocaleDateString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                                        <div className="text-emerald-400 font-medium flex items-center justify-end gap-1">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MMI Terpelihara
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Navigation Bar */}
                        <nav className="bg-slate-800/80 backdrop-blur border-t border-slate-700/50">
                            <div className="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
                                <div className="flex space-x-1 overflow-x-auto py-2 no-scrollbar">
                                    {[
                                        { id: 'dashboard', label: 'Papan Pemuka', icon: 'layout-dashboard' },
                                        { id: 'school', label: 'Profil Sekolah', icon: 'school' },
                                        { id: 'teachers', label: 'Data Guru', icon: 'users' },
                                        { id: 'absences', label: 'Permohonan Cuti', icon: 'calendar-x' },
                                        { id: 'schedule', label: 'Jadual Utama', icon: 'clock' },
                                        { id: 'relief', label: 'Penjanaan Relief', icon: 'zap' },
                                        { id: 'reports', label: 'Analisa & Laporan', icon: 'bar-chart-3' }
                                    ].map(tab => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`px-3 py-2 rounded-lg text-xs font-medium transition-all flex items-center gap-2 whitespace-nowrap ${
                                                activeTab === tab.id 
                                                ? 'bg-indigo-600 text-white shadow-sm' 
                                                : 'text-slate-300 hover:bg-slate-700/50 hover:text-white'
                                            }`}
                                        >
                                            <i data-lucide={tab.icon} className="w-4 h-4"></i>
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </nav>
                    </header>

                    {/* Main Content Body */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {activeTab === 'dashboard' && <DashboardView schoolInfo={schoolInfo} teachers={teachers} absences={absences} reliefs={reliefs} triggerResetModal={triggerResetModal} setActiveTab={setActiveTab} setPrintSlipData={setPrintSlipData} selectedGlobalDate={selectedGlobalDate} handleSetTodayGlobal={handleSetTodayGlobal} />}
                        {activeTab === 'school' && <SchoolProfileView schoolInfo={schoolInfo} setSchoolInfo={setSchoolInfo} />}
                        {activeTab === 'teachers' && <TeachersView teachers={teachers} setTeachers={setTeachers} triggerResetModal={triggerResetModal} />}
                        {activeTab === 'absences' && <AbsencesView absences={absences} setAbsences={setAbsences} teachers={teachers} masterSchedule={masterSchedule} reliefs={reliefs} setReliefs={setReliefs} triggerResetModal={triggerResetModal} selectedGlobalDate={selectedGlobalDate} setSelectedGlobalDate={setSelectedGlobalDate} handleSetTodayGlobal={handleSetTodayGlobal} setActiveTab={setActiveTab} />}
                        {activeTab === 'schedule' && <MasterScheduleView masterSchedule={masterSchedule} setMasterSchedule={setMasterSchedule} teachers={teachers} triggerResetModal={triggerResetModal} />}
                        {activeTab === 'relief' && <ReliefGeneratorView masterSchedule={masterSchedule} absences={absences} teachers={teachers} reliefs={reliefs} setReliefs={setReliefs} triggerResetModal={triggerResetModal} setPrintSlipData={setPrintSlipData} selectedGlobalDate={selectedGlobalDate} setSelectedGlobalDate={setSelectedGlobalDate} handleSetTodayGlobal={handleSetTodayGlobal} />}
                        {activeTab === 'reports' && <ReportsView schoolInfo={schoolInfo} teachers={teachers} reliefs={reliefs} absences={absences} triggerResetModal={triggerResetModal} />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-4 mt-auto no-print">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
                            <div>© 2026 e-Relief MMI - Sistem Pengurusan Guru Ganti Memelihara Masa Instruksional.</div>
                            <div className="text-slate-400">Standard Pengurusan KPM / JPN / PPD</div>
                        </div>
                    </footer>

                    {/* ADMIN PASSWORD CONFIRMATION MODAL */}
                    {showResetModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                                <div className="flex items-center gap-3 text-red-600">
                                    <div className="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                                        <i data-lucide="shield-alert" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-slate-900 text-base">Sahkan Kata Laluan Admin</h3>
                                        <p className="text-xs text-slate-500">Perlindungan data &amp; pembersihan sistem</p>
                                    </div>
                                </div>

                                <p className="text-xs text-slate-600 bg-slate-50 p-3 rounded border border-slate-200">
                                    Anda sedang membuat permintaan untuk pembersihan <strong className="text-red-600 uppercase">{
                                        resetType === 'all' ? 'KESEMUA DATA SISTEM' : 
                                        resetType === 'teachers' ? 'SEMUA DATA GURU' : 
                                        resetType === 'absences' ? 'REKOD KETIDAKHADIRAN' : 
                                        resetType === 'schedule' ? 'SENARAI REKOD JADUAL INDUK' : `REKOD RELIEF TARIKH ${selectedGlobalDate}`
                                    }</strong>. Sila masukkan kata laluan Pentadbir untuk meneruskan.
                                </p>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Kata Laluan Admin</label>
                                    <input 
                                        type="password" 
                                        placeholder="Masukkan kata laluan..."
                                        value={inputPassword}
                                        onChange={(e) => setInputPassword(e.target.value)}
                                        className="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-indigo-500 font-mono"
                                    />
                                    {passwordError && <p className="text-xs text-red-600 font-medium mt-1">{passwordError}</p>}
                                </div>

                                <div className="flex justify-end gap-2 pt-2">
                                    <button 
                                        onClick={() => { setShowResetModal(false); setInputPassword(''); setPasswordError(''); }}
                                        className="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">
                                        Batal
                                    </button>
                                    <button 
                                        onClick={handleExecuteReset}
                                        className="px-4 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg flex items-center gap-1">
                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Sahkan &amp; Padam
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PRINT SLIP MODAL */}
                    {printSlipData && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 space-y-4">
                                <div className="border-b pb-3 flex justify-between items-center no-print">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm">
                                        <i data-lucide="printer" className="w-4 h-4 text-indigo-600"></i> Slip Arahan Guru Ganti
                                    </h3>
                                    <button onClick={() => setPrintSlipData(null)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                                </div>

                                <div id="printableSlip" className="bg-white p-4 border border-slate-300 rounded-lg space-y-4 font-sans text-xs text-slate-800">
                                    <div className="text-center border-b pb-3 space-y-1">
                                        <h2 className="font-bold text-sm uppercase">{schoolInfo.name}</h2>
                                        <p className="text-[10px] text-slate-500">{schoolInfo.address}</p>
                                        <p className="font-bold text-indigo-900 text-xs mt-2 uppercase tracking-wide border border-indigo-200 bg-indigo-50 py-1 rounded">SLIP ARAHAN GURU GANTI (RELIEF MMI)</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded">
                                        <div><span className="font-semibold">Nama Guru Ganti:</span> <div className="font-bold text-indigo-700">{printSlipData.reliefTeacher}</div></div>
                                        <div><span className="font-semibold">Tarikh / Hari:</span> <div>{printSlipData.date || new Date().toISOString().split('T')[0]} ({printSlipData.day})</div></div>
                                        <div><span className="font-semibold">Mengantikan:</span> <div>{printSlipData.originalTeacher}</div></div>
                                        <div><span className="font-semibold">Sebab Ketiadaan:</span> <div>{printSlipData.reason || 'Tugas Luar / Cuti'}</div></div>
                                    </div>

                                    <div className="border rounded overflow-hidden">
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead className="bg-slate-100 font-semibold border-b">
                                                <tr>
                                                    <th className="p-2 border-r">Waktu / Masa</th>
                                                    <th className="p-2 border-r">Kelas</th>
                                                    <th className="p-2">Mata Pelajaran</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr className="border-b">
                                                    <td className="p-2 border-r font-medium">{printSlipData.timeSlot} ({printSlipData.slotNum})</td>
                                                    <td className="p-2 border-r font-bold text-slate-900">{printSlipData.class}</td>
                                                    <td className="p-2 font-medium text-slate-700">{printSlipData.subject}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="bg-amber-50 border border-amber-200 p-2.5 rounded text-[11px] text-amber-900">
                                        <strong>Modul/Tugasan MMI:</strong> {printSlipData.taskNote || "Sila rujuk modul MMI / lembaran kerja di meja guru berkenaan."}
                                    </div>

                                    <div className="pt-6 flex justify-between text-[10px] text-slate-500">
                                        <div>
                                            <p>Disediakan oleh:</p>
                                            <div className="h-8"></div>
                                            <p className="font-semibold">({schoolInfo.coordinator || 'Penyelaras Relief'})</p>
                                        </div>
                                        <div className="text-right">
                                            <p>Disahkan oleh:</p>
                                            <div className="h-8"></div>
                                            <p className="font-semibold">({schoolInfo.headmaster || 'Pengetua / Guru Besar'})</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-2 pt-2 no-print">
                                    <button onClick={() => setPrintSlipData(null)} className="px-4 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg">Tutup</button>
                                    <button onClick={() => window.print()} className="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg flex items-center gap-1">
                                        <i data-lucide="printer" className="w-3.5 h-3.5"></i> Cetak Slip
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BULK WHATSAPP MODAL */}
                    {showBulkWhatsAppModal && (
                        <BulkWhatsAppModal 
                            reliefs={reliefs} 
                            teachers={teachers} 
                            schoolInfo={schoolInfo}
                            handleCloseModal={() => setShowBulkWhatsAppModal(false)} 
                        />
                    )}
                </div>
            );
        }

        // ==========================================
        // 1. DASHBOARD VIEW
        // ==========================================
        function DashboardView({ schoolInfo, teachers, absences, reliefs, triggerResetModal, setActiveTab, setPrintSlipData, selectedGlobalDate, handleSetTodayGlobal }) {
            const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);
            const activeDate = selectedGlobalDate || todayStr;

            const todayAbsences = absences.filter(a => a.startDate <= activeDate && a.endDate >= activeDate);
            const todayReliefs = useMemo(() => {
                return reliefs
                    .filter(r => r.date === activeDate)
                    .sort((a, b) => (a.slotNum || '').localeCompare(b.slotNum || ''));
            }, [reliefs, activeDate]);

            const handlePrintOverallTodayRelief = () => {
                if (todayReliefs.length === 0) {
                    alert('Tiada rekod relief untuk cetakan keseluruhan bagi tarikh terpilih!');
                    return;
                }
                window.print();
            };

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-xs font-medium text-slate-500">Jumlah Guru Registered</p>
                                <h3 className="text-2xl font-bold text-slate-900 mt-1">{teachers.length} Guru</h3>
                            </div>
                            <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center">
                                <i data-lucide="users" className="w-6 h-6"></i>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-xs font-medium text-slate-500">Ketidakhadiran ({activeDate})</p>

        // ==========================================
        // 3. TEACHERS VIEW (DATA GURU)
        // ==========================================
        function TeachersView({ teachers, setTeachers, triggerResetModal }) {
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState({});
            const [newTeacher, setNewTeacher] = useState({ name: '', shortName: '', phone: '', option: '', otherSubjects: '', maxRelief: 8, status: 'Aktif' });

            const isPreschool = (option = '', status = '', name = '') => {
                const checkStr = `${option} ${status} ${name}`.toLowerCase();
                return checkStr.includes('prasekolah') || checkStr.includes('pra sekolah') || checkStr.includes('pra-sekolah');
            };

            const handleStartEdit = (t) => {
                setEditingId(t.id);
                setEditForm({ ...t });
            };

            const handleSaveEdit = () => {
                const updatedForm = { ...editForm };
                if (isPreschool(updatedForm.option, updatedForm.status, updatedForm.name)) {
                    updatedForm.maxRelief = 0;
                    if (!updatedForm.status.includes('Prasekolah')) {
                        updatedForm.status = 'Aktif (Prasekolah)';
                    }
                }
                setTeachers(teachers.map(t => t.id === editingId ? updatedForm : t));
                setEditingId(null);
            };

            const handleAddTeacher = (e) => {
                e.preventDefault();
                if (!newTeacher.name) return;

                const checkPreschool = isPreschool(newTeacher.option, newTeacher.status, newTeacher.name);
                const teacherObj = {
                    ...newTeacher,
                    id: `T_${Date.now()}`,
                    maxRelief: checkPreschool ? 0 : newTeacher.maxRelief,
                    status: checkPreschool ? 'Aktif (Prasekolah)' : newTeacher.status
                };
                setTeachers([...teachers, teacherObj]);
                setNewTeacher({ name: '', shortName: '', phone: '', option: '', otherSubjects: '', maxRelief: 8, status: 'Aktif' });
            };

            const handleDeleteTeacher = (id) => {
                if (confirm('Adakah anda pasti untuk memadam rekod guru ini?')) {
                    setTeachers(teachers.filter(t => t.id !== id));
                }
            };

            const handleExportCSV = () => {
                if (teachers.length === 0) {
                    alert('Tiada data guru untuk dieksport!');
                    return;
                }
                let csvContent = "data:text/csv;charset=utf-8,Nama Penuh,Nama Ringkas,No Telefon,Opsyen Utama,Subjek Lain,Had Relief,Status\n";
                teachers.forEach(t => {
                    const row = [
                        `"${t.name || ''}"`,
                        `"${t.shortName || ''}"`,
                        `"${t.phone || ''}"`,
                        `"${t.option || ''}"`,
                        `"${t.otherSubjects || ''}"`,
                        t.maxRelief !== undefined ? t.maxRelief : 8,
                        `"${t.status || 'Aktif'}"`
                    ].join(",");
                    csvContent += row + "\n";
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Data_Guru_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    const lines = text.split('\n');
                    const imported = [];

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const parts = line.split(',').map(p => p.replace(/^"|"$/g, '').trim());
                        if (parts.length >= 1 && parts[0]) {
                            const name = parts[0] || '';
                            const option = parts[3] || 'Umum';
                            const status = parts[6] || 'Aktif';
                            const checkPreschool = isPreschool(option, status, name);

                            imported.push({
                                id: `T_${Date.now()}_${i}`,
                                name: name,
                                shortName: parts[1] || name.substring(0, 10).toUpperCase(),
                                phone: parts[2] || '',
                                option: option,
                                otherSubjects: parts[4] || '-',
                                maxRelief: checkPreschool ? 0 : (parseInt(parts[5]) || 8),
                                status: checkPreschool ? 'Aktif (Prasekolah)' : status
                            });
                        }
                    }

                    if (imported.length > 0) {
                        setTeachers([...teachers, ...imported]);
                        alert(`Berjaya mengimport ${imported.length} rekod guru!`);
                    } else {
                        alert('Tiada data sah dijumpai dalam fail CSV tersebut.');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleDownloadTemplate = () => {
                const template = "Nama Penuh,Nama Ringkas,No Telefon,Opsyen Utama,Subjek Lain,Had Relief,Status\nAhmad Bin Abdullah,AHMAD,0123456789,Bahasa Melayu,Sejarah; Moral,8,Aktif\nSiti Fatimah Binti Ismail,FATIMAH,0198765432,Matematik,Sains; RBT,8,Aktif\nNorazlina Binti Kassim,NORAZLINA,0142233445,Prasekolah,-,0,Aktif (Prasekolah)";
                const encodedUri = encodeURI("data:text/csv;charset=utf-8," + template);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "Templat_Data_Guru.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-base font-bold text-slate-900">Pengurusan Data Guru</h2>
                            <p className="text-xs text-slate-500">Daftar maklumat guru, opsyen utama, subjek lain &amp; penetapan had ganti seminggu (Had automatik 0 untuk Guru Prasekolah).</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 text-xs">
                            <button onClick={handleDownloadTemplate} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg flex items-center gap-1">
                                <i data-lucide="file-text" className="w-3.5 h-3.5"></i> Templat CSV
                            </button>
                            <label className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg flex items-center gap-1 cursor-pointer">
                                <i data-lucide="upload" className="w-3.5 h-3.5"></i> Import CSV
                                <input type="file" accept=".csv" onChange={handleImportCSV} className="hidden" />
                            </label>
                            <button onClick={handleExportCSV} className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg flex items-center gap-1">
                                <i data-lucide="download" className="w-3.5 h-3.5"></i> Eksport CSV
                            </button>
                            <button onClick={() => triggerResetModal('teachers')} className="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-semibold flex items-center gap-1 border border-red-200">
                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Kosongkan Guru
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h3 className="font-bold text-slate-900 text-xs mb-3">Pendaftaran Guru Baharu</h3>
                        <form onSubmit={handleAddTeacher} className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-7 gap-3 text-xs">
                            <input type="text" placeholder="Nama Penuh" value={newTeacher.name} onChange={e => setNewTeacher({ ...newTeacher, name: e.target.value })} className="p-2 border rounded-lg" required />
                            <input type="text" placeholder="Nama Ringkas" value={newTeacher.shortName} onChange={e => setNewTeacher({ ...newTeacher, shortName: e.target.value })} className="p-2 border rounded-lg" />
                            <input type="text" placeholder="No. Telefon" value={newTeacher.phone} onChange={e => setNewTeacher({ ...newTeacher, phone: e.target.value })} className="p-2 border rounded-lg" />
                            <input 
                                type="text" 
                                placeholder="Opsyen Utama (cth: Prasekolah)" 
                                value={newTeacher.option} 
                                onChange={e => {
                                    const val = e.target.value;
                                    const checkPre = isPreschool(val, newTeacher.status, newTeacher.name);
                                    setNewTeacher({ 
                                        ...newTeacher, 
                                        option: val, 
                                        maxRelief: checkPre ? 0 : newTeacher.maxRelief 
                                    });
                                }} 
                                className="p-2 border rounded-lg" 
                            />
                            <input type="text" placeholder="Subjek Lain" value={newTeacher.otherSubjects} onChange={e => setNewTeacher({ ...newTeacher, otherSubjects: e.target.value })} className="p-2 border rounded-lg" />
                            <input 
                                type="number" 
                                placeholder="Had Relief Seminggu" 
                                value={isPreschool(newTeacher.option, newTeacher.status, newTeacher.name) ? 0 : newTeacher.maxRelief} 
                                onChange={e => setNewTeacher({ ...newTeacher, maxRelief: parseInt(e.target.value) || 0 })} 
                                disabled={isPreschool(newTeacher.option, newTeacher.status, newTeacher.name)}
                                className={`p-2 border rounded-lg ${isPreschool(newTeacher.option, newTeacher.status, newTeacher.name) ? 'bg-slate-100 font-bold text-red-600' : ''}`} 
                                title="Had Relief Seminggu" 
                            />
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg p-2 flex items-center justify-center gap-1">
                                <i data-lucide="plus" className="w-4 h-4"></i> Tambah Guru
                            </button>
                        </form>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                            <thead className="bg-slate-50 text-slate-700 font-semibold border-b">
                                <tr>
                                    <th className="p-3">Nama Penuh</th>
                                    <th className="p-3">Ringkas</th>
                                    <th className="p-3">No. Telefon</th>
                                    <th className="p-3">Opsyen Utama</th>
                                    <th className="p-3">Subjek Lain</th>
                                    <th className="p-3">Had Relief (W/Mggu)</th>
                                    <th className="p-3 text-center">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody>
                                {teachers.map(t => {
                                    const teacherIsPreschool = isPreschool(t.option, t.status, t.name);

                                    return (
                                        <tr key={t.id} className="border-b hover:bg-slate-50">
                                            {editingId === t.id ? (
                                                <React.Fragment>
                                                    <td className="p-2"><input type="text" value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2"><input type="text" value={editForm.shortName} onChange={e => setEditForm({ ...editForm, shortName: e.target.value })} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2"><input type="text" value={editForm.phone} onChange={e => setEditForm({ ...editForm, phone: e.target.value })} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2">
                                                        <input 
                                                            type="text" 
                                                            value={editForm.option} 
                                                            onChange={e => {
                                                                const val = e.target.value;
                                                                const checkPre = isPreschool(val, editForm.status, editForm.name);
                                                                setEditForm({ 
                                                                    ...editForm, 
                                                                    option: val, 
                                                                    maxRelief: checkPre ? 0 : editForm.maxRelief 
                                                                });
                                                            }} 
                                                            className="w-full p-1 border rounded" 
                                                        />
                                                    </td>
                                                    <td className="p-2"><input type="text" value={editForm.otherSubjects} onChange={e => setEditForm({ ...editForm, otherSubjects: e.target.value })} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2">
                                                        <input 
                                                            type="number" 
                                                            value={isPreschool(editForm.option, editForm.status, editForm.name) ? 0 : editForm.maxRelief} 
                                                            onChange={e => setEditForm({ ...editForm, maxRelief: parseInt(e.target.value) || 0 })} 
                                                            disabled={isPreschool(editForm.option, editForm.status, editForm.name)}
                                                            className={`w-full p-1 border rounded ${isPreschool(editForm.option, editForm.status, editForm.name) ? 'bg-slate-100 font-bold text-red-600' : ''}`} 
                                                        />
                                                    </td>
                                                    <td className="p-2 text-center space-x-1">
                                                        <button onClick={handleSaveEdit} className="px-2 py-1 bg-emerald-600 text-white rounded text-[11px] font-semibold">Simpan</button>
                                                        <button onClick={() => setEditingId(null)} className="px-2 py-1 bg-slate-300 text-slate-700 rounded text-[11px] font-semibold">Batal</button>
                                                    </td>
                                                </React.Fragment>
                                            ) : (
                                                <React.Fragment>
                                                    <td className="p-3 font-semibold text-slate-900">{t.name}</td>
                                                    <td className="p-3 text-slate-600 font-mono">{t.shortName}</td>
                                                    <td className="p-3 text-slate-600">{t.phone}</td>
                                                    <td className="p-3 font-medium text-indigo-700">
                                                        {t.option}
                                                        {teacherIsPreschool && <span className="ml-1 text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">Prasekolah</span>}
                                                    </td>
                                                    <td className="p-3 text-slate-600">{t.otherSubjects || '-'}</td>
                                                    <td className="p-3 font-bold text-slate-800">
                                                        {teacherIsPreschool ? (
                                                            <span className="text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-200">0 Masa (Pengecualian)</span>
                                                        ) : (
                                                            `${t.maxRelief !== undefined ? t.maxRelief : 8} Masa`
                                                        )}
                                                    </td>
                                                    <td className="p-3 text-center space-x-2">
                                                        <button onClick={() => handleStartEdit(t)} className="text-indigo-600 hover:text-indigo-900 font-semibold">Sunting</button>
                                                        <button onClick={() => handleDeleteTeacher(t.id)} className="text-red-600 hover:text-red-900 font-semibold">Padam</button>
                                                    </td>
                                                </React.Fragment>
                                            )}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. ABSENCES VIEW (PERMOHONAN CUTI)
        // ==========================================
        function AbsencesView({ absences, setAbsences, teachers, masterSchedule, reliefs, setReliefs, triggerResetModal, selectedGlobalDate, setSelectedGlobalDate, handleSetTodayGlobal, setActiveTab }) {
            const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);

            const DEFAULT_CLASSES = [
                "1 Saga", "1 Wira", "1 Perdana", "2 Saga", "2 Wira", "2 Perdana",
                "3 Saga", "3 Wira", "3 Perdana", "4 Saga", "4 Wira", "4 Perdana",
                "5 Juara", "5 Saga", "5 Wira", "5 Perdana", "6 Saga", "6 Wira", "6 Perdana"
            ];

            const DEFAULT_TIME_SLOTS = [
                "Masa 1", "Masa 2", "Masa 3", "Masa 4", "Masa 5", 
                "Masa 6", "Masa 7", "Masa 8", "Masa 9", "Masa 10"
            ];

            const [teacherName, setTeacherName] = useState('');
            const [leaveType, setLeaveType] = useState('Cuti Rehat Khas (CRK)');
            const [timeOffCategory, setTimeOffCategory] = useState('Dalaman');
            const [selectedClasses, setSelectedClasses] = useState([]);
            const [manualClasses, setManualClasses] = useState('');
            const [selectedTimeSlots, setSelectedTimeSlots] = useState([]);
            const [manualTimeSlots, setManualTimeSlots] = useState('');
            const [startDate, setStartDate] = useState(todayStr);
            const [startTime, setStartTime] = useState('08:00');
            const [endTime, setEndTime] = useState('10:00');
            const [reason, setReason] = useState('');

            const [editingAbsenceId, setEditingAbsenceId] = useState(null);

            const [filterTeacher, setFilterTeacher] = useState('Semua');
            const [filterLeaveType, setFilterLeaveType] = useState('Semua');
            const filterDate = selectedGlobalDate;

            // Helper function untuk semakan Time Off bagi janaan relief saat akhir
            const checkSlotTimeOff = (abs, slot) => {
                if (abs.leaveType !== 'Time Off / Urusan Rasmi') return true;

                if (abs.timeOffCategory === 'Dalaman') {
                    const selSlots = abs.selectedTimeSlots || [];
                    const manSlots = abs.timeOffSlotsManual ? abs.timeOffSlotsManual.split(',').map(s => s.trim()) : [];
                    const allSlots = [...selSlots, ...manSlots];

                    if (allSlots.length > 0) {
                        const isSlotInSlots = allSlots.some(s => s.toLowerCase() === (slot.slotNum || '').toLowerCase());
                        if (isSlotInSlots) return false;
                    }

                    if (abs.startTime && abs.endTime && slot.timeSlot) {
                        const times = slot.timeSlot.split('-').map(t => t.trim());
                        if (times.length === 2) {
                            if (times[1] > abs.startTime && times[0] < abs.endTime) return false;
                        }
                    }

                    const selClasses = abs.selectedClasses || [];
                    const manClasses = abs.timeOffClassesManual ? abs.timeOffClassesManual.split(',').map(c => c.trim()) : [];
                    const allAbsClasses = [...selClasses, ...manClasses];
                    if (allAbsClasses.length > 0 && allAbsClasses.some(c => c.toLowerCase() === (slot.class || '').toLowerCase())) return false;
                }

                const selSlots = abs.selectedTimeSlots || [];
                const manSlots = abs.timeOffSlotsManual ? abs.timeOffSlotsManual.split(',').map(s => s.trim()) : [];
                const allSlots = [...selSlots, ...manSlots];

                if (allSlots.length > 0) {
                    const isSlotInSlots = allSlots.some(s => s.toLowerCase() === (slot.slotNum || '').toLowerCase());
                    if (!isSlotInSlots) return false;
                }

                if (abs.startTime && abs.endTime && slot.timeSlot) {
                    const times = slot.timeSlot.split('-').map(t => t.trim());
                    if (times.length === 2) {
                        if (times[1] <= abs.startTime || times[0] >= abs.endTime) return false;
                    }
                }

                return true;
            };

            // JANAAN RELIEF SAAT AKHIR INDIVIDU (TANPA MENGUBAH RELIEF LAIN)
            const handleGenerateLateRelief = (absenceRecord) => {
                const targetDate = absenceRecord.startDate;
                const dateObj = new Date(targetDate);
                const dayMap = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
                const targetDay = dayMap[dateObj.getDay()] || 'Isnin';

                // Tapis slot mengajar guru ini sahaja
                const teacherSlots = masterSchedule.filter(s => s.day === targetDay && s.teacher === absenceRecord.teacherName);

                if (teacherSlots.length === 0) {
                    alert(`Tiada slot pengajaran dijumpai untuk ${absenceRecord.teacherName} pada hari ${targetDay}.`);
                    return;
                }

                // Senarai guru tidak hadir pada tarikh sasaran untuk elak dipilih
                const todayAbsences = absences.filter(a => a.startDate <= targetDate && a.endDate >= targetDate);

                // Pengiraan bebanan semasa untuk sekatan had
                const dailyCounts = {};
                const weeklyCounts = {};
                const monthlyCounts = {};
                const targetMonth = targetDate.substring(0, 7);

                reliefs.forEach(r => {
                    if (r.reliefTeacher && r.reliefTeacher !== "Sila Pilih Guru (Manual)") {
                        if (r.date === targetDate) dailyCounts[r.reliefTeacher] = (dailyCounts[r.reliefTeacher] || 0) + 1;
                        weeklyCounts[r.reliefTeacher] = (weeklyCounts[r.reliefTeacher] || 0) + 1;
                        if (r.date && r.date.startsWith(targetMonth)) monthlyCounts[r.reliefTeacher] = (monthlyCounts[r.reliefTeacher] || 0) + 1;
                    }
                });

                const newLateReliefs = [];

                teacherSlots.forEach(slot => {
                    if (!checkSlotTimeOff(absenceRecord, slot)) return;

                    // Semak jika slot guru ini sudah pernah dijana relief
                    const alreadyExists = reliefs.some(r => r.date === targetDate && r.originalTeacher === absenceRecord.teacherName && r.slotNum === slot.slotNum && r.class === slot.class);
                    if (alreadyExists) return;

                    // Penapisan syarat Prasekolah
                    const classLower = (slot.class || '').toLowerCase();
                    const subjLower = (slot.subject || '').toLowerCase();
                    const isPreschoolClass = classLower.includes('prasekolah') || classLower.includes('pra sekolah') || classLower.includes('pra-sekolah');
                    
                    if (isPreschoolClass) {
                        const isAllowedPreschoolSubject = 
                            subjLower.includes('bahasa malaysia') || subjLower.includes('b. malaysia') || 
                            subjLower.includes('bahasa melayu') || subjLower.includes('b. melayu') ||
                            subjLower.includes('bahasa inggeris') || subjLower.includes('b. inggeris') || 
                            subjLower.includes('english') || subjLower.includes('matematik') || 
                            subjLower.includes('math') || subjLower.includes('baca bersama');

                        const slotNumLower = (slot.slotNum || '').toLowerCase();
                        const isPreschoolBreakfastSlot = slotNumLower.includes('masa 2') || slotNumLower.includes('masa 3');
                        
                        let isBreakfastTimeRange = false;
                        if (slot.timeSlot) {
                            const times = slot.timeSlot.split('-').map(t => t.trim());
                            if (times.length === 2 && times[1] > '08:10' && times[0] < '09:10') {
                                isBreakfastTimeRange = true;
                            }
                        }

                        if (!isAllowedPreschoolSubject && !isPreschoolBreakfastSlot && !isBreakfastTimeRange) return;
                    }

                    // Cari guru yang sedang mengajar slot ini
                    const busyTeachers = new Set();
                    masterSchedule.forEach(s => {
                        if (s.day === targetDay && s.slotNum === slot.slotNum && s.teacher) busyTeachers.add(s.teacher);
                    });

                    // Tapis guru layak
                    const eligibleTeachers = teachers.filter(t => {
                        const checkStr = `${t.option || ''} ${t.status || ''} ${t.name || ''}`.toLowerCase();
                        if (checkStr.includes('prasekolah') || checkStr.includes('pra sekolah') || checkStr.includes('pra-sekolah')) return false;
                        if (todayAbsences.some(a => a.teacherName === t.name)) return false;
                        if (busyTeachers.has(t.name)) return false;

                        const dC = dailyCounts[t.name] || 0;
                        const wC = weeklyCounts[t.name] || 0;
                        const mC = monthlyCounts[t.name] || 0;
                        const maxW = Math.min(t.maxRelief !== undefined ? t.maxRelief : 8, 8);

                        if (dC >= 2 || wC >= maxW || mC >= 24) return false;
                        return true;
                    });

                    let chosenTeacher = eligibleTeachers.find(t => 
                        (t.option || '').toLowerCase().includes(slot.subject.toLowerCase()) || 
                        (t.otherSubjects || '').toLowerCase().includes(slot.subject.toLowerCase())
                    );

                    if (!chosenTeacher && eligibleTeachers.length > 0) {
                        eligibleTeachers.sort((a, b) => {
                            const dA = dailyCounts[a.name] || 0;
                            const dB = dailyCounts[b.name] || 0;
                            if (dA !== dB) return dA - dB;
                            return (weeklyCounts[a.name] || 0) - (weeklyCounts[b.name] || 0);
                        });
                        chosenTeacher = eligibleTeachers[0];
                    }

                    if (chosenTeacher) {
                        dailyCounts[chosenTeacher.name] = (dailyCounts[chosenTeacher.name] || 0) + 1;
                        weeklyCounts[chosenTeacher.name] = (weeklyCounts[chosenTeacher.name] || 0) + 1;
                        monthlyCounts[chosenTeacher.name] = (monthlyCounts[chosenTeacher.name] || 0) + 1;
                    }

                    newLateReliefs.push({
                        id: `REL_LATE_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
                        date: targetDate,
                        day: targetDay,
                        timeSlot: slot.timeSlot,
                        slotNum: slot.slotNum,
                        class: slot.class,
                        subject: slot.subject,
                        originalTeacher: absenceRecord.teacherName,
                        reliefTeacher: chosenTeacher ? chosenTeacher.name : "Sila Pilih Guru (Manual)",
                        reason: `${absenceRecord.leaveType} (Saat Akhir)`,
                        isAuto: !!chosenTeacher
                    });
                });

                if (newLateReliefs.length === 0) {
                    alert(`Slot relief bagi ${absenceRecord.teacherName} pada ${targetDate} telah sedia ada atau tiada slot terlibat.`);
                    return;
                }

                // TAMBAH KEPADA RELIEF SEDIA ADA TANPA MEMADAM REKOD LAIN
                setReliefs([...reliefs, ...newLateReliefs]);
                setSelectedGlobalDate(targetDate);
                alert(`Berjaya menjana ${newLateReliefs.length} slot relief saat akhir untuk ${absenceRecord.teacherName}! Sistem akan membuka Modul Penjanaan Relief.`);
                setActiveTab('relief');
            };

            const handleToggleClass = (className) => {
                if (selectedClasses.includes(className)) {
                    setSelectedClasses(selectedClasses.filter(c => c !== className));
                } else {
                    setSelectedClasses([...selectedClasses, className]);
                }
            };

            const handleToggleTimeSlot = (slotName) => {
                if (selectedTimeSlots.includes(slotName)) {
                    setSelectedTimeSlots(selectedTimeSlots.filter(s => s !== slotName));
                } else {
                    setSelectedTimeSlots([...selectedTimeSlots, slotName]);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!teacherName) {
                    alert('Sila pilih nama guru!');
                    return;
                }

                const newAbsence = {
                    id: editingAbsenceId || `ABS_${Date.now()}`,
                    teacherName,
                    leaveType,
                    timeOffCategory: leaveType === 'Time Off / Urusan Rasmi' ? timeOffCategory : '',
                    selectedClasses: leaveType === 'Time Off / Urusan Rasmi' ? selectedClasses : [],
                    timeOffClassesManual: leaveType === 'Time Off / Urusan Rasmi' ? manualClasses : '',
                    selectedTimeSlots: leaveType === 'Time Off / Urusan Rasmi' ? selectedTimeSlots : [],
                    timeOffSlotsManual: leaveType === 'Time Off / Urusan Rasmi' ? manualTimeSlots : '',
                    startDate,
                    endDate: startDate,
                    startTime: leaveType === 'Time Off / Urusan Rasmi' ? startTime : '',
                    endTime: leaveType === 'Time Off / Urusan Rasmi' ? endTime : '',
                    reason
                };

                if (editingAbsenceId) {
                    setAbsences(absences.map(a => a.id === editingAbsenceId ? newAbsence : a));
                    setEditingAbsenceId(null);
                    alert('Rekod permohonan cuti berjaya dikemas kini!');
                } else {
                    setAbsences([newAbsence, ...absences]);
                    alert('Permohonan cuti / Time Off berjaya didaftarkan!');
                }

                setTeacherName('');
                setReason('');
                setSelectedClasses([]);
                setManualClasses('');
                setSelectedTimeSlots([]);
                setManualTimeSlots('');
            };

            const handleEdit = (absence) => {
                setEditingAbsenceId(absence.id);
                setTeacherName(absence.teacherName || '');
                setLeaveType(absence.leaveType || 'Cuti Rehat Khas (CRK)');
                setTimeOffCategory(absence.timeOffCategory || 'Dalaman');
                setSelectedClasses(absence.selectedClasses || []);
                setManualClasses(absence.timeOffClassesManual || '');
                setSelectedTimeSlots(absence.selectedTimeSlots || []);
                setManualTimeSlots(absence.timeOffSlotsManual || '');
                setStartDate(absence.startDate || todayStr);
                setStartTime(absence.startTime || '08:00');
                setEndTime(absence.endTime || '10:00');
                setReason(absence.reason || '');
            };

            const handleDelete = (id) => {
                if (confirm('Adakah anda pasti untuk memadam rekod cuti ini?')) {
                    setAbsences(absences.filter(a => a.id !== id));
                }
            };

            const filteredAbsences = useMemo(() => {
                return absences.filter(a => {
                    const matchTeacher = filterTeacher === 'Semua' || a.teacherName === filterTeacher;
                    const matchType = filterLeaveType === 'Semua' || a.leaveType === filterLeaveType;
                    const matchDate = !filterDate || (a.startDate <= filterDate && a.endDate >= filterDate);
                    return matchTeacher && matchType && matchDate;
                });
            }, [absences, filterTeacher, filterLeaveType, filterDate]);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-base font-bold text-slate-900">Permohonan Cuti &amp; Time Off Guru</h2>
                            <p className="text-xs text-slate-500">Daftar permohonan cuti rasmi atau Time Off (Dalaman/Luaran) berserta perincian slot masa mengajar terjejas.</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => triggerResetModal('absences')} className="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-semibold flex items-center gap-1 border border-red-200">
                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Kosongkan Rekod Cuti
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <h3 className="font-bold text-slate-900 text-xs border-b pb-2">
                            {editingAbsenceId ? '✏️ Sunting Rekod Permohonan Cuti' : '➕ Pendaftaran Permohonan Cuti / Time Off Baharu'}
                        </h3>
                        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">Pilih Guru</label>
                                    <select value={teacherName} onChange={e => setTeacherName(e.target.value)} className="w-full p-2.5 border rounded-lg font-medium" required>
                                        <option value="">-- Pilih Guru --</option>
                                        {teachers.map(t => <option key={t.id} value={t.name}>{t.name} ({t.shortName})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">Jenis Ketidakhadiran</label>
                                    <select value={leaveType} onChange={e => setLeaveType(e.target.value)} className="w-full p-2.5 border rounded-lg font-medium">
                                        <option value="Cuti Rehat Khas (CRK)">Cuti Rehat Khas (CRK)</option>
                                        <option value="Cuti Sakit (MC)">Cuti Sakit (MC)</option>
                                        <option value="Time Off / Urusan Rasmi">Time Off / Urusan Rasmi</option>
                                        <option value="Kursus / Bengkel">Kursus / Bengkel</option>
                                        <option value="Guru Pengiring Program">Guru Pengiring Program</option>
                                        <option value="Cuti Ibadah (Haji / Umrah / Keagamaan)">Cuti Ibadah (Haji / Umrah / Keagamaan)</option>
                                        <option value="Cuti Tanpa Rekod (CTR)">Cuti Tanpa Rekod (CTR)</option>
                                        <option value="Cuti Bersalin">Cuti Bersalin</option>
                                        <option value="Cuti Kuarantin">Cuti Kuarantin</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">Tarikh</label>
                                    <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-2.5 border rounded-lg font-bold" required />
                                </div>
                            </div>

                            {leaveType === 'Time Off / Urusan Rasmi' && (
                                <div className="p-4 bg-indigo-50/60 rounded-xl border border-indigo-200 space-y-4">
                                    <div className="font-bold text-indigo-900 border-b border-indigo-200 pb-1 flex items-center justify-between">
                                        <span>⏰ Tetapan Masa &amp; Slot Mengajar Terjejas (Time Off)</span>
                                        <div className="flex gap-4">
                                            <label className="flex items-center gap-1 cursor-pointer">
                                                <input type="radio" name="timeoff_cat" value="Dalaman" checked={timeOffCategory === 'Dalaman'} onChange={() => setTimeOffCategory('Dalaman')} /> Dalaman
                                            </label>
                                            <label className="flex items-center gap-1 cursor-pointer">
                                                <input type="radio" name="timeoff_cat" value="Luaran" checked={timeOffCategory === 'Luaran'} onChange={() => setTimeOffCategory('Luaran')} /> Luaran
                                            </label>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Masa Mula</label>
                                            <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full p-2 border rounded-lg bg-white font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Masa Tamat</label>
                                            <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full p-2 border rounded-lg bg-white font-bold" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1.5">Pilih Slot Masa Kelas Terlibat (Waktu Dijana Relief):</label>

                                </button>

                        </form>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                        <div className="flex justify-between items-center mb-3">

                                {filterDate === todayStr && (

                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 text-slate-700 font-semibold border-b">

                                    <th className="p-3">Jenis Cuti</th>

                                            {a.startTime && <div className="font-semibold text-indigo-700">⏱️ {a.startTime} - {a.endTime}</div>}
                                            {((a.selectedTimeSlots && a.selectedTimeSlots.length > 0) || a.timeOffSlotsManual) && (
                                                <div className="text-[11px] text-amber-800 font-bold">
                                                    ⏰ Slot: {[...(a.selectedTimeSlots || []), ...(a.timeOffSlotsManual ? a.timeOffSlotsManual.split(',') : [])].join(', ')}
                                                </div>

                                            {((a.selectedClasses && a.selectedClasses.length > 0) || a.timeOffClassesManual) && (
                                                <div className="text-[11px] text-emerald-700 font-bold">

                                                </div>

                                                title="Jana Relief khas untuk permohonan guru ini sahaja tanpa menjejaskan relief lain"
                                            >
