        }

        // ==========================================
        // 5. MASTER SCHEDULE VIEW (JADUAL UTAMA)
        // ==========================================
        function MasterScheduleView({ masterSchedule, setMasterSchedule, teachers = [], triggerResetModal }) {
            const [editingIndex, setEditingIndex] = useState(null);
            const [editForm, setEditForm] = useState({});
            
            const [filterDay, setFilterDay] = useState('Semua');
            const [filterClass, setFilterClass] = useState('Semua');
            const [filterDomain, setFilterDomain] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');

            // Mod Paparan: 'list' (Senarai Rekod) atau 'weekly' (Jadual Mingguan)
            const [viewMode, setViewMode] = useState('list');
            const [weeklyFilterType, setWeeklyFilterType] = useState('teacher'); // 'teacher' | 'class'
            const [selectedWeeklyTarget, setSelectedWeeklyTarget] = useState('');

            const [newSlot, setNewSlot] = useState({
                day: 'Isnin',
                slotNum: 'Masa 1',
                timeSlot: '07:30 - 08:00',
                class: '',
                subject: '',
                teacher: '',
                teacher1: '',
                teacher2: '',
                teacher3: '',
                domain: 'Perdana'
            });

            // Helper untuk mengenal pasti sama ada subjek/bidang guna multi-guru (Pemulihan, Tasmik, Quran)
            const isMultiTeacherSlot = (subject = '', domain = 'Perdana') => {
                const sLower = subject.toLowerCase();
                const dLower = (domain || 'Perdana').toLowerCase();
                return dLower === 'pemulihan' || sLower.includes('tasmik') || sLower.includes('quran');
            };

            // Helper mengekstrak Guru 1, Guru 2, Guru 3 daripada slot sedia ada
            const getSlotTeachersArray = (slot) => {
                if (slot.teacher1 || slot.teacher2 || slot.teacher3) {
                    return [slot.teacher1 || '', slot.teacher2 || '', slot.teacher3 || ''];
                }
                const parts = (slot.teacher || '').split(/[,&]|\bdan\b/i).map(t => t.trim()).filter(Boolean);
                return [parts[0] || '', parts[1] || '', parts[2] || ''];
            };

            // Gabungkan Guru 1, 2, 3 menjadi rentetan tunggal untuk paparan & keserasian enjin relief
            const combineTeachersString = (t1, t2, t3) => {
                return [t1, t2, t3].map(t => (t || '').trim()).filter(Boolean).join(' & ');
            };

            const uniqueClasses = useMemo(() => {
                const classes = new Set(masterSchedule.map(s => s.class).filter(Boolean));
                return Array.from(classes).sort();
            }, [masterSchedule]);

            const uniqueTeachersInSchedule = useMemo(() => {
                const setT = new Set();
                teachers.forEach(t => { if (t.name) setT.add(t.name); });
                masterSchedule.forEach(s => {
                    const arr = getSlotTeachersArray(s);
                    arr.forEach(name => { if (name) setT.add(name); });
                });
                return Array.from(setT).sort();
            }, [masterSchedule, teachers]);

            // Tetapkan pilihan lalai apabila menukar tab Jadual Mingguan
            useEffect(() => {
                if (viewMode === 'weekly') {
                    if (weeklyFilterType === 'teacher' && (!selectedWeeklyTarget || !uniqueTeachersInSchedule.includes(selectedWeeklyTarget))) {
                        setSelectedWeeklyTarget(uniqueTeachersInSchedule[0] || '');
                    } else if (weeklyFilterType === 'class' && (!selectedWeeklyTarget || !uniqueClasses.includes(selectedWeeklyTarget))) {
                        setSelectedWeeklyTarget(uniqueClasses[0] || '');
                    }
                }
            }, [viewMode, weeklyFilterType, uniqueTeachersInSchedule, uniqueClasses]);

            // Helper Validation: Menyemak had bilangan guru mengikut subjek dan bidang
            const validateTeachersCount = (subject, domain, teacherStr) => {
                if (!teacherStr || !teacherStr.trim()) return { valid: true };

                const teachersList = teacherStr.split(/[,&]|\bdan\b/i).map(t => t.trim()).filter(Boolean);
                const subjLower = (subject || '').toLowerCase();
                const domLower = (domain || 'perdana').toLowerCase();

                const isTasmikOrQuran = subjLower.includes('tasmik') || subjLower.includes('quran');
                const isPemulihan = domLower === 'pemulihan';

                if (isTasmikOrQuran && teachersList.length > 3) {
                    return {
                        valid: false,
                        message: `Subjek ${subject} hanya membenarkan MAKSIMUM 3 orang guru sahaja dalam satu slot!`
                    };
                }

                if (isPemulihan && teachersList.length > 2) {
                    return {
                        valid: false,
                        message: `Slot Bidang Pemulihan hanya membenarkan MAKSIMUM 2 orang guru sahaja dalam satu slot!`
                    };
                }

                return { valid: true };
            };

            const handleStartEdit = (idx, slot) => {
                const [t1, t2, t3] = getSlotTeachersArray(slot);
                setEditingIndex(idx);
                setEditForm({
                    domain: 'Perdana',
                    ...slot,
                    teacher1: t1,
                    teacher2: t2,
                    teacher3: t3
                });
            };

            const handleSaveEdit = (idx) => {
                const isMulti = isMultiTeacherSlot(editForm.subject, editForm.domain);
                const combinedTeacher = isMulti
                    ? combineTeachersString(editForm.teacher1, editForm.teacher2, editForm.domain === 'Pemulihan' ? '' : editForm.teacher3)
                    : editForm.teacher;

                if (!combinedTeacher) {
                    alert('Sila masukkan sekurang-kurangnya seorang Guru Mengajar!');
                    return;
                }

                const validation = validateTeachersCount(editForm.subject, editForm.domain, combinedTeacher);
                if (!validation.valid) {
                    alert(validation.message);
                    return;
                }

                const updated = [...masterSchedule];
                updated[idx] = {
                    ...editForm,
                    teacher: combinedTeacher,
                    teacher1: isMulti ? (editForm.teacher1 || '').trim() : combinedTeacher,
                    teacher2: isMulti ? (editForm.teacher2 || '').trim() : '',
                    teacher3: (isMulti && editForm.domain !== 'Pemulihan') ? (editForm.teacher3 || '').trim() : ''
                };
                setMasterSchedule(updated);
                setEditingIndex(null);
            };

            const handleDeleteSlot = (idx) => {
                if (confirm('Adakah anda pasti untuk memadam slot jadual ini?')) {
                    setMasterSchedule(masterSchedule.filter((_, i) => i !== idx));
                }
            };

            const handleAddSlot = (e) => {
                e.preventDefault();
                const isMulti = isMultiTeacherSlot(newSlot.subject, newSlot.domain);
                const combinedTeacher = isMulti
                    ? combineTeachersString(newSlot.teacher1, newSlot.teacher2, newSlot.domain === 'Pemulihan' ? '' : newSlot.teacher3)
                    : newSlot.teacher;

                if (!newSlot.class || !combinedTeacher || !newSlot.subject) {
                    alert('Sila lengkapkan maklumat Kelas, Subjek dan Guru!');
                    return;
                }

                const validation = validateTeachersCount(newSlot.subject, newSlot.domain, combinedTeacher);
                if (!validation.valid) {
                    alert(validation.message);
                    return;
                }

                const slotToAdd = {
                    day: newSlot.day,
                    slotNum: newSlot.slotNum,
                    timeSlot: newSlot.timeSlot,
                    class: newSlot.class,
                    subject: newSlot.subject,
                    domain: newSlot.domain,
                    teacher: combinedTeacher,
                    teacher1: isMulti ? (newSlot.teacher1 || '').trim() : combinedTeacher,
                    teacher2: isMulti ? (newSlot.teacher2 || '').trim() : '',
                    teacher3: (isMulti && newSlot.domain !== 'Pemulihan') ? (newSlot.teacher3 || '').trim() : ''
                };

                setMasterSchedule([...masterSchedule, slotToAdd]);
                setNewSlot({
                    day: 'Isnin',
                    slotNum: 'Masa 1',
                    timeSlot: '07:30 - 08:00',
                    class: '',
                    subject: '',
                    teacher: '',
                    teacher1: '',
                    teacher2: '',
                    teacher3: '',
                    domain: 'Perdana'
                });
            };

            const handleExportCSV = () => {
                if (masterSchedule.length === 0) {
                    alert('Tiada data jadual untuk dieksport!');
                    return;
                }
                let csvContent = "data:text/csv;charset=utf-8,Hari,Waktu (Nombor Slot),Slot Masa,Kelas,Subjek,Guru Mengajar,Bidang,Guru 1,Guru 2,Guru 3\n";
                masterSchedule.forEach(s => {
                    const [t1, t2, t3] = getSlotTeachersArray(s);
                    const row = [
                        `"${s.day || ''}"`,
                        `"${s.slotNum || ''}"`,
                        `"${s.timeSlot || ''}"`,
                        `"${s.class || ''}"`,
                        `"${s.subject || ''}"`,
                        `"${s.teacher || ''}"`,
                        `"${s.domain || 'Perdana'}"`,
                        `"${t1 || ''}"`,
                        `"${t2 || ''}"`,
                        `"${t3 || ''}"`
                    ].join(",");
                    csvContent += row + "\n";
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Jadual_Induk_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    const lines = text.split('\n');
                    const imported = [];

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const parts = line.split(',').map(p => p.replace(/^"|"$/g, '').trim());
                        if (parts.length >= 4) {
                            const g1 = parts[7] || '';
                            const g2 = parts[8] || '';
                            const g3 = parts[9] || '';
                            const fallbackTeacher = parts[5] || '';
                            const combined = (g1 || g2 || g3) ? combineTeachersString(g1, g2, g3) : fallbackTeacher;
                            const extractedArr = combined.split(/[,&]|\bdan\b/i).map(t => t.trim()).filter(Boolean);

                            imported.push({
                                day: parts[0] || 'Isnin',
                                slotNum: parts[1] || 'Masa 1',
                                timeSlot: parts[2] || '08:00 - 08:30',
                                class: parts[3] || '',
                                subject: parts[4] || '',
                                teacher: combined,
                                domain: parts[6] || 'Perdana',
                                teacher1: g1 || extractedArr[0] || '',
                                teacher2: g2 || extractedArr[1] || '',
                                teacher3: g3 || extractedArr[2] || ''
                            });
                        }
                    }

                    if (imported.length > 0) {
                        setMasterSchedule([...masterSchedule, ...imported]);
                        alert(`Berjaya mengimport ${imported.length} slot jadual induk!`);
                    } else {
                        alert('Tiada data sah dijumpai dalam fail CSV tersebut.');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleDownloadTemplate = () => {
                const template = "Hari,Waktu (Nombor Slot),Slot Masa,Kelas,Subjek,Guru Mengajar,Bidang,Guru 1,Guru 2,Guru 3\nIsnin,Masa 1,07:30 - 08:00,1 Saga,Tasmik,Zulkifli & Ahmad & Fatimah,Perdana,Zulkifli,Ahmad,Fatimah\nIsnin,Masa 2,08:00 - 08:30,4 Wira,Matematik,Siti Fatimah & Lim Wei Sheng,Pemulihan,Siti Fatimah,Lim Wei Sheng,\nIsnin,Masa 3,08:30 - 09:00,Pra Bestari,Bahasa Malaysia,Norazlina Binti Kassim,Prasekolah,Norazlina Binti Kassim,,\nIsnin,Masa 4,09:00 - 09:30,PPKI 1,Pengurusan Diri,Kavitha A/P Muthu,Pendidikan Khas,Kavitha A/P Muthu,,";
                const encodedUri = encodeURI("data:text/csv;charset=utf-8," + template);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "Templat_Jadual_Induk.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const filteredSchedule = useMemo(() => {
                const dayOrder = { "Isnin": 1, "Selasa": 2, "Rabu": 3, "Khamis": 4, "Jumaat": 5, "Sabtu": 6, "Ahad": 7 };

                const getSlotNumber = (slotStr) => {
                    if (!slotStr) return 99;
                    const num = slotStr.replace(/[^0-9]/g, '');
                    return num ? parseInt(num, 10) : 99;
                };

                const filtered = masterSchedule.filter(s => {
                    const matchDay = filterDay === 'Semua' || s.day === filterDay;
                    const matchClass = filterClass === 'Semua' || s.class === filterClass;
                    const matchDomain = filterDomain === 'Semua' || (s.domain || 'Perdana') === filterDomain;
                    const q = searchQuery.toLowerCase();
                    const matchSearch = !searchQuery || 
                        (s.subject || '').toLowerCase().includes(q) || 
                        (s.teacher || '').toLowerCase().includes(q) ||
                        (s.class || '').toLowerCase().includes(q) ||
                        (s.domain || 'Perdana').toLowerCase().includes(q);
                    return matchDay && matchClass && matchDomain && matchSearch;
                });

                return filtered.sort((a, b) => {
                    const dayA = dayOrder[a.day] || 99;
                    const dayB = dayOrder[b.day] || 99;
                    if (dayA !== dayB) return dayA - dayB;

                    const slotA = getSlotNumber(a.slotNum);
                    const slotB = getSlotNumber(b.slotNum);
                    return slotA - slotB;
                });
            }, [masterSchedule, filterDay, filterClass, filterDomain, searchQuery]);

            // Susunan data untuk Grid Jadual Mingguan (Isnin - Jumaat mengikut Masa 1 - Masa 12)
            const weeklyGridData = useMemo(() => {
                const days = ["Isnin", "Selasa", "Rabu", "Khamis", "Jumaat"];
                const slotNumsSet = new Set(["Masa 1", "Masa 2", "Masa 3", "Masa 4", "Masa 5", "Masa 6", "Masa 7", "Masa 8", "Masa 9", "Masa 10"]);
                
                const relevantSlots = masterSchedule.filter(s => {
                    if (weeklyFilterType === 'teacher') {
                        const slotTeachers = getSlotTeachersArray(s);
                        return slotTeachers.some(t => t.toLowerCase() === (selectedWeeklyTarget || '').toLowerCase()) ||
                               (s.teacher || '').toLowerCase().includes((selectedWeeklyTarget || '').toLowerCase());
                    } else {
                        return (s.class || '').toLowerCase() === (selectedWeeklyTarget || '').toLowerCase();
                    }
                });

                relevantSlots.forEach(s => {
                    if (s.slotNum) slotNumsSet.add(s.slotNum);
                });

                const sortedSlots = Array.from(slotNumsSet).sort((a, b) => {
                    const numA = parseInt(a.replace(/[^0-9]/g, ''), 10) || 99;
                    const numB = parseInt(b.replace(/[^0-9]/g, ''), 10) || 99;
                    return numA - numB;
                });

                return { days, sortedSlots, relevantSlots };

                                                                <button onClick={() => handleStartEdit(actualIndex, s)} className="text-indigo-600 hover:text-indigo-900 font-semibold">Sunting</button>
                                                                <button onClick={() => handleDeleteSlot(actualIndex)} className="text-red-600 hover:text-red-900 font-semibold">Padam</button>
                                                            </td>
                                                        </React.Fragment>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </React.Fragment>
                    )}
                </div>
            );
        }

        const handleSendSingleWhatsApp = (relief, teachers) => {
            const teacherObj = teachers.find(t => t.name === relief.reliefTeacher);
            if (!teacherObj || !teacherObj.phone) {
                alert(`Nombor telefon untuk ${relief.reliefTeacher} tidak dijumpai dalam rekod Data Guru!`);
                return;
            }

            let phone = teacherObj.phone.replace(/[^0-9]/g, '');
            if (phone.startsWith('0')) phone = '6' + phone;

            let msg = `*NOTIFIKASI GURU GANTI (RELIEF MMI)*\n\n`;
            msg += `Assalam / Salam Sejahtera Cikgu *${relief.reliefTeacher}*,\n\n`;
            msg += `Anda telah ditetapkan sebagai Guru Ganti untuk tugasan berikut:\n`;
            msg += `📅 Tarikh: *${relief.date}* (${relief.day})\n`;
            msg += `⏱️ Waktu: *${relief.timeSlot}* (${relief.slotNum})\n`;
            msg += `🏫 Kelas: *${relief.class}*\n`;
            msg += `📚 Subjek: *${relief.subject}*\n`;
            msg += `👤 Menggantikan: *${relief.originalTeacher}*\n\n`;
            msg += `Mohon maklum & memelihara Masa Instruksional. Terima kasih!`;

            const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        };

        // ==========================================
        // 6. RELIEF GENERATOR VIEW
        // ==========================================
        function ReliefGeneratorView({ masterSchedule, absences, teachers, reliefs, setReliefs, triggerResetModal, setPrintSlipData, selectedGlobalDate, setSelectedGlobalDate, handleSetTodayGlobal }) {
            const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);
            const selectedDate = selectedGlobalDate || todayStr;
            const setSelectedDate = (val) => setSelectedGlobalDate(val);
            const [selectedDay, setSelectedDay] = useState('Isnin');
            const [showBulkWhatsAppModal, setShowBulkWhatsAppModal] = useState(false);

            const [filterSlot, setFilterSlot] = useState('Semua');
            const [filterClass, setFilterClass] = useState('Semua');
            const [filterSubject, setFilterSubject] = useState('Semua');
            const [filterAbsentTeacher, setFilterAbsentTeacher] = useState('Semua');
            const [filterReliefTeacher, setFilterReliefTeacher] = useState('Semua');

            // Helper: Kenal pasti sama ada guru ialah guru yang mengajar subjek PPM
            const isPPMTeacher = (teacherObj) => {
                if (!teacherObj) return false;
                const profileStr = `${teacherObj.name || ''} ${teacherObj.shortName || ''} ${teacherObj.option || ''} ${teacherObj.otherSubjects || ''} ${teacherObj.status || ''}`.toLowerCase();
                const hasPPMInProfile = /\bppm\b/.test(profileStr) || profileStr.includes('pembantu pengurusan murid');
                const hasPPMInSchedule = masterSchedule.some(s => {
                    const subj = (s.subject || '').toLowerCase();
                    const tStr = (s.teacher || '').toLowerCase();
                    const tNameLower = (teacherObj.name || '').toLowerCase();
                    return (/\bppm\b/.test(subj) || subj.includes('pembantu pengurusan murid')) && tStr.includes(tNameLower);
                });
                return hasPPMInProfile || hasPPMInSchedule;
            };

            // Helper: Semak sama ada slot/kelas adalah dalam bidang Prasekolah
            const isPreschoolTargetSlot = (slotClass = '', slotDomain = '') => {
                const cLower = (slotClass || '').toLowerCase();
                const dLower = (slotDomain || '').toLowerCase();
                if (dLower === 'prasekolah') return true;
                if (cLower.includes('prasekolah') || cLower.includes('pra sekolah') || cLower.includes('pra-sekolah') || cLower.startsWith('pra ')) return true;
                return masterSchedule.some(s =>
                    (s.class || '').toLowerCase() === cLower &&
                    (s.domain || '').toLowerCase() === 'prasekolah'
                );
            };

            // Helper: Semak sama ada guru adalah Guru Pengawas Sekolah Tahun 6, Guru Kelas / Guru Damping, atau PPM
            const isExemptFromReliefQuota = (teacherObj) => {
                if (!teacherObj) return false;
                if (isPPMTeacher(teacherObj)) return true;
                const checkStr = `${teacherObj.name || ''} ${teacherObj.shortName || ''} ${teacherObj.option || ''} ${teacherObj.otherSubjects || ''} ${teacherObj.status || ''}`.toLowerCase();
                return (
                    checkStr.includes('pengawas sekolah tahun 6') ||
                    checkStr.includes('pengawas tahun 6') ||
                    checkStr.includes('guru kelas') ||
                    checkStr.includes('guru damping')
                );
            };

            useEffect(() => {
                const dateObj = new Date(selectedDate);
                const dayMap = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
                setSelectedDay(dayMap[dateObj.getDay()] || 'Isnin');
            }, [selectedDate]);

            // Pengiraan Jumlah Masa Mengajar Guru Pada Hari Terpilih Merujuk Jadual Utama
            const teacherDailyTeachingSlotsCount = useMemo(() => {
                const counts = {};
                masterSchedule.forEach(s => {
                    if (s.day === selectedDay && s.teacher) {
                        const teachersList = s.teacher.split(/[,&]|\bdan\b/i).map(t => t.trim()).filter(Boolean);
                        teachersList.forEach(tName => {
                            counts[tName] = (counts[tName] || 0) + 1;
                        });
                    }
                });
                return counts;
            }, [masterSchedule, selectedDay]);

            // Pengiraan Bebanan Guru SEHARI (pada tarikh terpilih)
            const teacherDailyReliefCounts = useMemo(() => {
                const counts = {};
                reliefs.forEach(r => {
                    if (r.date === selectedDate && r.reliefTeacher && r.reliefTeacher !== "Sila Pilih Guru (Manual)") {
                        counts[r.reliefTeacher] = (counts[r.reliefTeacher] || 0) + 1;
                    }
                });
                return counts;
            }, [reliefs, selectedDate]);

            // Pengiraan Bebanan Guru Seminggu
            const teacherWeeklyReliefCounts = useMemo(() => {
                const counts = {};
                reliefs.forEach(r => {
                    if (r.reliefTeacher && r.reliefTeacher !== "Sila Pilih Guru (Manual)") {
                        counts[r.reliefTeacher] = (counts[r.reliefTeacher] || 0) + 1;
                    }
                });
                return counts;
            }, [reliefs]);

            // Pengiraan Bebanan Guru Sebulan
            const selectedMonthStr = useMemo(() => selectedDate.substring(0, 7), [selectedDate]);
            const teacherMonthlyReliefCounts = useMemo(() => {
                const counts = {};
                reliefs.forEach(r => {
                    if (r.date && r.date.startsWith(selectedMonthStr) && r.reliefTeacher && r.reliefTeacher !== "Sila Pilih Guru (Manual)") {
                        counts[r.reliefTeacher] = (counts[r.reliefTeacher] || 0) + 1;
                    }
                });
                return counts;
            }, [reliefs, selectedMonthStr]);

            const busyTeachersThisSlot = (day, slotNum) => {
                const busy = new Set();
                masterSchedule.forEach(s => {
                    if (s.day === day && s.slotNum === slotNum && s.teacher) {
                        busy.add(s.teacher);
                    }
                });
                return busy;
            };

            const tasmikQuranCoTeachersThisSlot = (day, slotNum) => {
                const coTeachers = new Set();
                masterSchedule.forEach(s => {
                    if (s.day === day && s.slotNum === slotNum && s.teacher) {
                        const subj = (s.subject || '').toLowerCase();
                        if (subj.includes('tasmik') || subj.includes('quran')) {
                            coTeachers.add(s.teacher);
                        }
                    }
                });
                return coTeachers;
            };

            const reliefsToday = useMemo(() => {
                return reliefs.filter(r => r.date === selectedDate);
            }, [reliefs, selectedDate]);

            const filteredReliefsToday = useMemo(() => {
                return reliefsToday.filter(r => {
                    const matchSlot = filterSlot === 'Semua' || r.slotNum === filterSlot;
                    const matchClass = filterClass === 'Semua' || r.class === filterClass;
                    const matchSubject = filterSubject === 'Semua' || r.subject === filterSubject;
                    const matchAbsent = filterAbsentTeacher === 'Semua' || r.originalTeacher === filterAbsentTeacher;
                    const matchRelief = filterReliefTeacher === 'Semua' || r.reliefTeacher === filterReliefTeacher;
                    return matchSlot && matchClass && matchSubject && matchAbsent && matchRelief;
                });
            }, [reliefsToday, filterSlot, filterClass, filterSubject, filterAbsentTeacher, filterReliefTeacher]);

            const uniqueSlots = useMemo(() => Array.from(new Set(reliefsToday.map(r => r.slotNum).filter(Boolean))).sort(), [reliefsToday]);
            const uniqueClasses = useMemo(() => Array.from(new Set(reliefsToday.map(r => r.class).filter(Boolean))).sort(), [reliefsToday]);
            const uniqueSubjects = useMemo(() => Array.from(new Set(reliefsToday.map(r => r.subject).filter(Boolean))).sort(), [reliefsToday]);
            const uniqueAbsentTeachers = useMemo(() => Array.from(new Set(reliefsToday.map(r => r.originalTeacher).filter(Boolean))).sort(), [reliefsToday]);
            const uniqueReliefTeachers = useMemo(() => Array.from(new Set(reliefsToday.map(r => r.reliefTeacher).filter(Boolean))).sort(), [reliefsToday]);

            const isSlotAffectedByTimeOff = (abs, slot) => {
                if (abs.leaveType !== 'Time Off / Urusan Rasmi') return true;

                // ARAHAN KHAS: Jika Time Off Dalaman, slot kelas terjejas TIDAK PERLU dijana guru ganti dalam sistem
                if (abs.timeOffCategory === 'Dalaman') {
                    const selSlots = abs.selectedTimeSlots || [];
                    const manSlots = abs.timeOffSlotsManual ? abs.timeOffSlotsManual.split(',').map(s => s.trim()) : [];
                    const allSlots = [...selSlots, ...manSlots];

                    if (allSlots.length > 0) {
                        const isSlotInSlots = allSlots.some(s => s.toLowerCase() === (slot.slotNum || '').toLowerCase());
                        if (isSlotInSlots) return false;
                    }

                    if (abs.startTime && abs.endTime && slot.timeSlot) {
                        const times = slot.timeSlot.split('-').map(t => t.trim());
                        if (times.length === 2) {
                            const slotStart = times[0];
                            const slotEnd = times[1];
                            if (slotEnd > abs.startTime && slotStart < abs.endTime) {
                                return false;
                            }
                        }
                    }

                    const selClasses = abs.selectedClasses || [];
                    const manClasses = abs.timeOffClassesManual ? abs.timeOffClassesManual.split(',').map(c => c.trim()) : [];
                    const allAbsClasses = [...selClasses, ...manClasses];
                    if (allAbsClasses.length > 0 && allAbsClasses.some(c => c.toLowerCase() === (slot.class || '').toLowerCase())) {
                        return false;
                    }
                }

                const selSlots = abs.selectedTimeSlots || [];
                const manSlots = abs.timeOffSlotsManual ? abs.timeOffSlotsManual.split(',').map(s => s.trim()) : [];
                const allSlots = [...selSlots, ...manSlots];

                if (allSlots.length > 0) {
                    const isSlotInSlots = allSlots.some(s => s.toLowerCase() === (slot.slotNum || '').toLowerCase());
                    if (!isSlotInSlots) return false;
                }

                if (abs.startTime && abs.endTime && slot.timeSlot) {
                    const times = slot.timeSlot.split('-').map(t => t.trim());
                    if (times.length === 2) {
                        const slotStart = times[0];
                        const slotEnd = times[1];
                        if (slotEnd <= abs.startTime || slotStart >= abs.endTime) {
                            return false;
                        }
                    }
                }

                return true;
            };

            const getCoTeachersForSlot = (day, slotNum, className, subjectName, domain) => {
                const coTeachers = new Set();
                const sLower = (subjectName || '').toLowerCase();
                const cLower = (className || '').toLowerCase();
                const domLower = (domain || 'perdana').toLowerCase();

                masterSchedule.forEach(s => {
                    if (s.day === day && s.slotNum === slotNum && s.teacher) {
                        const matchClass = (s.class || '').toLowerCase() === cLower;
                        const matchSubj = (s.subject || '').toLowerCase() === sLower;
                        const matchDomain = (s.domain || 'perdana').toLowerCase() === domLower;
                        
                        if (matchClass && matchSubj && matchDomain) {
                            coTeachers.add(s.teacher);
                        }
                    }
                });
                return coTeachers;
            };

            // Enjin Penjanaan Relief Automatik
            const handleAutoGenerate = () => {
                const todayAbsences = absences.filter(a => a.startDate <= selectedDate && a.endDate >= selectedDate);
                if (todayAbsences.length === 0) {
                    alert(`Tiada rekod ketidakhadiran direkodkan untuk tarikh ${selectedDate}.`);
                    return;
                }

                const newReliefs = [];

                const dynamicDailyCounts = { ...teacherDailyReliefCounts };
                const dynamicWeeklyCounts = { ...teacherWeeklyReliefCounts };
                const dynamicMonthlyCounts = { ...teacherMonthlyReliefCounts };

                todayAbsences.forEach(abs => {
                    const absentTeacherSlots = masterSchedule.filter(s => s.day === selectedDay && s.teacher === abs.teacherName);

                    absentTeacherSlots.forEach(slot => {
                        if (!isSlotAffectedByTimeOff(abs, slot)) {
                            return;
                        }

                        const subjLower = (slot.subject || '').toLowerCase();
                        const classLower = (slot.class || '').toLowerCase();
                        const domainLower = (slot.domain || 'perdana').toLowerCase();

                        const isPreschoolClass = isPreschoolTargetSlot(slot.class, slot.domain);
                        if (isPreschoolClass) {
                            const isAllowedPreschoolSubject = 
                                subjLower.includes('bahasa malaysia') || 
                                subjLower.includes('b. malaysia') || 
                                subjLower.includes('bahasa melayu') || 
                                subjLower.includes('b. melayu') ||
                                subjLower.includes('bahasa inggeris') || 
                                subjLower.includes('b. inggeris') || 
                                subjLower.includes('english') ||
                                subjLower.includes('matematik') || 
                                subjLower.includes('math') ||
                                subjLower.includes('baca bersama');

                            const slotNumLower = (slot.slotNum || '').toLowerCase();
                            const isPreschoolBreakfastSlot = slotNumLower.includes('masa 2') || slotNumLower.includes('masa 3');
                            
                            let isBreakfastTimeRange = false;
                            if (slot.timeSlot) {
                                const times = slot.timeSlot.split('-').map(t => t.trim());
                                if (times.length === 2) {
                                    const sStart = times[0];
                                    const sEnd = times[1];
                                    if (sEnd > '08:10' && sStart < '09:10') {
                                        isBreakfastTimeRange = true;
                                    }
                                }
                            }

                            if (!isAllowedPreschoolSubject && !isPreschoolBreakfastSlot && !isBreakfastTimeRange) {
                                return;
                            }
                        }

                        if (domainLower === 'pemulihan') {
                            const coTeachers = getCoTeachersForSlot(selectedDay, slot.slotNum, slot.class, slot.subject, slot.domain);
                            const absentCoTeachers = Array.from(coTeachers).filter(tName => 
                                todayAbsences.some(a => a.teacherName === tName)
                            );

                            if (coTeachers.size >= 2 && absentCoTeachers.length < coTeachers.size) {
                                return;
                            }

                            if (absentCoTeachers.length >= 2) {
                                const alreadyGenerated = newReliefs.some(r => r.slotNum === slot.slotNum && r.class === slot.class && r.subject === slot.subject);
                                if (alreadyGenerated) return;
                            }
                        }

                        const isTasmikOrQuran = subjLower.includes('tasmik') || subjLower.includes('quran');

                        if (isTasmikOrQuran) {
                            const coTeachers = tasmikQuranCoTeachersThisSlot(selectedDay, slot.slotNum);
                            const absentCoTeachers = Array.from(coTeachers).filter(tName => 
                                todayAbsences.some(a => a.teacherName === tName)
                            );

                            if (absentCoTeachers.length === 1) {
                                return;
                            }

                            if (absentCoTeachers.length >= 2) {
                                const alreadyGenerated = newReliefs.some(r => r.slotNum === slot.slotNum && r.class === slot.class);
                                if (alreadyGenerated) return;
                            }
                        }

                        const busyTeachers = busyTeachersThisSlot(selectedDay, slot.slotNum);
                        
                        // Kelayakan Guru:
                        // 1. Bukan Prasekolah
                        // 2. Tidak bercuti / Time Off
                        // 3. Tidak bertembung mengajar
                        // 4. Had SEHARI MAXIMUM 2 MASA (dynamicDailyCounts < 2)
                        // 5. Had SEMINGGU MAXIMUM 8 MASA & SEBULAN MAXIMUM 24 MASA
                        // 6. BAHARU: Guru mengajar > 7 masa pada hari tersebut merujuk Jadual Utama DISEKAT (Kecuali subjek Pemulihan, Tasmik & Quran)
                        const isExemptFromHeavyLoadCheck = domainLower === 'pemulihan' || isTasmikOrQuran;

                        const eligibleTeachers = teachers.filter(t => {
                            const teacherIsPPM = isPPMTeacher(t);

                            // ARAHAN KHAS PPM: Guru subjek PPM hanya boleh menggantikan kelas bidang Prasekolah sahaja
                            if (teacherIsPPM) {
                                if (!isPreschoolClass) return false;
                            } else {
                                const checkStr = `${t.option || ''} ${t.status || ''} ${t.name || ''}`.toLowerCase();
                                const isPreschool = checkStr.includes('prasekolah') || checkStr.includes('pra sekolah') || checkStr.includes('pra-sekolah');
                                if (isPreschool) return false;
                            }

                            if (todayAbsences.some(a => a.teacherName === t.name)) return false;
                            if (busyTeachers.has(t.name)) return false;

                            // Semakan beban mengajar Jadual Utama (>7 masa) - dikecualikan untuk PPM di Prasekolah
                            const dailyTeachingSlots = teacherDailyTeachingSlotsCount[t.name] || 0;
                            if (!teacherIsPPM && !isExemptFromHeavyCheck && dailyTeachingSlots > 7) {
                                return false; // Sekat daripada pilihan auto
                            }
                            
                            // Pengecualian had kuota harian, mingguan & bulanan bagi Guru Pengawas Sekolah Tahun 6, Guru Kelas / Guru Damping & PPM
                            if (!isExemptFromReliefQuota(t)) {
                                const dailyCount = dynamicDailyCounts[t.name] || 0;
                                const weeklyCount = dynamicWeeklyCounts[t.name] || 0;
                                const monthlyCount = dynamicMonthlyCounts[t.name] || 0;
                                const maxW = Math.min(t.maxRelief !== undefined ? t.maxRelief : 8, 8);
                                
                                if (dailyCount >= 2 || weeklyCount >= maxW || monthlyCount >= 24) return false;
                            }
                            return true;
                        });

                        let chosenTeacher = eligibleTeachers.find(t => 
                            (isPreschoolClass && isPPMTeacher(t)) ||
                            (t.option || '').toLowerCase().includes(slot.subject.toLowerCase()) || 
                            (t.otherSubjects || '').toLowerCase().includes(slot.subject.toLowerCase())
                        );

                        if (!chosenTeacher && eligibleTeachers.length > 0) {
                            eligibleTeachers.sort((a, b) => {
                                const dA = dynamicDailyCounts[a.name] || 0;
                                const dB = dynamicDailyCounts[b.name] || 0;
                                if (dA !== dB) return dA - dB;
                                return (dynamicWeeklyCounts[a.name] || 0) - (dynamicWeeklyCounts[b.name] || 0);
                            });
                            chosenTeacher = eligibleTeachers[0];
                        }

                        if (chosenTeacher) {
                            dynamicDailyCounts[chosenTeacher.name] = (dynamicDailyCounts[chosenTeacher.name] || 0) + 1;
                            dynamicWeeklyCounts[chosenTeacher.name] = (dynamicWeeklyCounts[chosenTeacher.name] || 0) + 1;
                            dynamicMonthlyCounts[chosenTeacher.name] = (dynamicMonthlyCounts[chosenTeacher.name] || 0) + 1;
                        }

                        newReliefs.push({
                            id: `REL_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
                            date: selectedDate,
                            day: selectedDay,
                            timeSlot: slot.timeSlot,
                            slotNum: slot.slotNum,
                            class: slot.class,
                            subject: slot.subject,
                            originalTeacher: abs.teacherName,
                            reliefTeacher: chosenTeacher ? chosenTeacher.name : "Sila Pilih Guru (Manual)",
                            reason: abs.leaveType,
                            isAuto: !!chosenTeacher
                        });
                    });
                });

                if (newReliefs.length === 0) {
                    alert('Tiada slot ganti baharu perlu dijana untuk tarikh ini mengikut syarat ketetapan.');
                    return;
                }

                const filteredOld = reliefs.filter(r => r.date !== selectedDate);
                setReliefs([...filteredOld, ...newReliefs]);
                alert(`Berjaya menjana ${newReliefs.length} slot guru ganti!`);
            };

            const handleManualChange = (reliefId, newTeacherName, currentRelief) => {
                if (newTeacherName !== "Sila Pilih Guru (Manual)") {
                    const selectedTeacherObj = teachers.find(t => t.name === newTeacherName);
                    const teacherIsPPM = isPPMTeacher(selectedTeacherObj);
                    const targetIsPreschool = isPreschoolTargetSlot(currentRelief.class);

                    if (teacherIsPPM && !targetIsPreschool) {
                        alert(`Sekatan PPM: Guru subjek PPM (${newTeacherName}) hanya dibenarkan menggantikan kelas dalam bidang Prasekolah sahaja!`);
                        return;
                    }

                    const subjLower = (currentRelief.subject || '').toLowerCase();
                    const isPemulihanOrTasmikQuran = subjLower.includes('tasmik') || subjLower.includes('quran');
                    
                    // Semak jika slot bidang Pemulihan
                    const isPemulihanSlot = masterSchedule.some(s => 
                        s.day === selectedDay && 
                        s.slotNum === currentRelief.slotNum && 
                        s.class === currentRelief.class && 
                        (s.domain || 'perdana').toLowerCase() === 'pemulihan'
                    );

                    const isExemptFromHeavyLoad = isPemulihanOrTasmikQuran || isPemulihanSlot || teacherIsPPM;

                    const dailyTeachingSlots = teacherDailyTeachingSlotsCount[newTeacherName] || 0;
                    if (!isExemptFromHeavyLoad && dailyTeachingSlots > 7) {
                        alert(`Sekatan: Guru ini mengajar ${dailyTeachingSlots} masa (>7 masa) pada hari ${selectedDay} mengikut Jadual Utama!`);
                        return;
                    }

                    if (!isExemptFromReliefQuota(selectedTeacherObj)) {
                        const dCount = teacherDailyReliefCounts[newTeacherName] || 0;
                        const wCount = teacherWeeklyReliefCounts[newTeacherName] || 0;
                        const mCount = teacherMonthlyReliefCounts[newTeacherName] || 0;

                        if (dCount >= 2) {
                            alert(`Sekatan: Guru ini telah mencapai had maksimum 2 masa relief SEHARI!`);
                            return;
                        }
                        if (wCount >= 8) {
                            alert(`Sekatan: Guru ini telah mencapai had maksimum 8 masa relief seminggu!`);
                            return;
                        }
                        if (mCount >= 24) {
                            alert(`Sekatan: Guru ini telah mencapai had maksimum 24 masa relief sebulan!`);
                            return;
                        }
                    }
                }
                setReliefs(reliefs.map(r => r.id === reliefId ? { ...r, reliefTeacher: newTeacherName, isAuto: false } : r));
            };

            const handleExportCSV = () => {
                if (filteredReliefsToday.length === 0) {
                    alert('Tiada data relief untuk dieksport pada tarikh/saringan ini!');
                    return;
                }
                let csvContent = "data:text/csv;charset=utf-8,Tarikh,Hari,Waktu Slot,Nombor Slot,Kelas,Subjek,Guru Tidak Hadir,Sebab,Guru Ganti,Mod Janaan\n";
                filteredReliefsToday.forEach(r => {
                    const row = [
                        `"${r.date || ''}"`,
                        `"${r.day || ''}"`,
                        `"${r.timeSlot || ''}"`,
                        `"${r.slotNum || ''}"`,
                        `"${r.class || ''}"`,
                        `"${r.subject || ''}"`,
                        `"${r.originalTeacher || ''}"`,
                        `"${r.reason || ''}"`,
                        `"${r.reliefTeacher || ''}"`,
                        `"${r.isAuto ? 'Auto' : 'Manual'}"`
                    ].join(",");
                    csvContent += row + "\n";
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Data_Relief_${selectedDate}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

        function ReportsView({ schoolInfo, teachers, reliefs, absences, triggerResetModal }) {
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().substring(0, 7));

            const monthlyReliefs = useMemo(() => {
                return reliefs.filter(r => r.date && r.date.startsWith(selectedMonth));
            }, [reliefs, selectedMonth]);

            const monthlyAbsences = useMemo(() => {
                return absences.filter(a => a.startDate && a.startDate.startsWith(selectedMonth));
            }, [absences, selectedMonth]);

            const leaveTypeStats = useMemo(() => {
                const typeCounts = {};
                monthlyAbsences.forEach(a => {
                    const type = a.leaveType || 'Lain-lain';
                    typeCounts[type] = (typeCounts[type] || 0) + 1;
                });

                const total = monthlyAbsences.length;
                const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1', '#14b8a6'];

                return Object.entries(typeCounts).map(([type, count], idx) => ({
                    type,
                    count,
                    percentage: total > 0 ? ((count / total) * 100).toFixed(1) : 0,
                    color: colors[idx % colors.length]
                }));
            }, [monthlyAbsences]);

            const activeTeacherReliefCounts = useMemo(() => {
                const counts = {};
                monthlyReliefs.forEach(r => {
                    if (r.reliefTeacher && r.reliefTeacher !== "Sila Pilih Guru (Manual)") {
                        counts[r.reliefTeacher] = (counts[r.reliefTeacher] || 0) + 1;
                    }
                });

                const list = [];
                teachers.forEach(t => {
                    const checkStr = `${t.option || ''} ${t.status || ''} ${t.name || ''}`.toLowerCase();
                    const isPreschool = checkStr.includes('prasekolah') || checkStr.includes('pra sekolah') || checkStr.includes('pra-sekolah');

                    if (!isPreschool) {
                        list.push({
                            name: t.name,
                            shortName: t.shortName || t.name,
                            count: counts[t.name] || 0,
                            option: t.option
                        });
                    }
                });

                list.sort((a, b) => b.count - a.count);

                return list;
            }, [teachers, monthlyReliefs]);

            const top5Highest = useMemo(() => activeTeacherReliefCounts.slice(0, 5), [activeTeacherReliefCounts]);
            const top5Lowest = useMemo(() => {
                const sortedLowest = [...activeTeacherReliefCounts].sort((a, b) => a.count - b.count);
                return sortedLowest.slice(0, 5);
            }, [activeTeacherReliefCounts]);

            const pieChartPaths = useMemo(() => {
                let cumulativeAngle = 0;
                return leaveTypeStats.map(item => {
                    const angle = (parseFloat(item.percentage) / 100) * 360;
                    const startAngle = cumulativeAngle;
                    const endAngle = cumulativeAngle + angle;
                    cumulativeAngle += angle;

                    const x1 = 50 + 40 * Math.cos((Math.PI * (startAngle - 90)) / 180);
                    const y1 = 50 + 40 * Math.sin((Math.PI * (startAngle - 90)) / 180);
                    const x2 = 50 + 40 * Math.cos((Math.PI * (endAngle - 90)) / 180);
                    const y2 = 50 + 40 * Math.sin((Math.PI * (endAngle - 90)) / 180);

                    const largeArcFlag = angle > 180 ? 1 : 0;

                    const pathData = angle >= 360 
                        ? `M 50 10 A 40 40 0 1 1 49.99 10 Z`
                        : `M 50 50 L ${x1} ${y1} A 40 40 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;

                    return { ...item, pathData };
                });
            }, [leaveTypeStats]);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print">
                        <div>
                            <h2 className="text-base font-bold text-slate-900">Analisa MMI &amp; Laporan One Page Report (OPR)</h2>
                            <p className="text-xs text-slate-500">Penjanaan laporan bulanan MMI rasmi untuk pengesahan pihak pentadbir dan PPD/JPN.</p>
                        </div>
                        <div className="flex items-center gap-2 text-xs">
                            <input 
                                type="month" 
                                value={selectedMonth} 
                                onChange={e => setSelectedMonth(e.target.value)} 
                                className="p-2 border rounded-lg font-bold text-slate-800"
                            />
                            <button 
                                onClick={() => window.print()} 
                                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg flex items-center gap-1.5 shadow-sm"
                            >
                                <i data-lucide="printer" className="w-4 h-4"></i> Cetakan Laporan 1 Muka (OPR / PDF)
                            </button>
                        </div>
                    </div>

                    <div id="printableReport" className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4 text-xs text-slate-800">
                        <div className="border-b-2 border-slate-900 pb-3 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                {schoolInfo.badgeBase64 ? (
                                    <img src={schoolInfo.badgeBase64} alt="Lencana Sekolah" className="w-14 h-14 object-contain" />
                                ) : (
                                    <div className="w-14 h-14 bg-slate-900 text-white font-bold flex items-center justify-center rounded text-xl">
                                        MMI
                                    </div>
                                )}
                                <div>
                                    <h1 className="text-base font-bold text-slate-900 uppercase tracking-wide">{schoolInfo.name}</h1>
                                    <p className="text-[11px] text-slate-600">{schoolInfo.address}</p>
                                    <p className="text-[10px] text-slate-500">Kod: {schoolInfo.code} | Tel: {schoolInfo.phone} | Kategori: {schoolInfo.category || 'Sekolah Bandar'}</p>
                                </div>
                            </div>
                            <div className="text-right border-l pl-4 border-slate-300">
                                <div className="text-xs font-bold text-indigo-900 uppercase">ONE PAGE REPORT (OPR)</div>
                                <div className="text-xs font-bold text-slate-700">PENGURUSAN GURU GANTI (MMI)</div>
                                <div className="text-[11px] text-slate-500 font-mono mt-0.5">Bulan: {selectedMonth}</div>
                            </div>
                        </div>

                        <div className="grid grid-cols-4 gap-3 text-center">
                            <div className="p-2.5 bg-slate-50 border rounded-lg">
                                <div className="text-[10px] font-semibold text-slate-500 uppercase">Jumlah Guru Aktif</div>
                                <div className="text-base font-bold text-slate-900">{teachers.length} Guru</div>
                            </div>
                            <div className="p-2.5 bg-red-50 border border-red-200 rounded-lg">
                                <div className="text-[10px] font-semibold text-red-700 uppercase">Kes Ketidakhadiran</div>
                                <div className="text-base font-bold text-red-600">{monthlyAbsences.length} Permohonan</div>
                            </div>
                            <div className="p-2.5 bg-indigo-50 border border-indigo-200 rounded-lg">
                                <div className="text-[10px] font-semibold text-indigo-700 uppercase">Jumlah Slot Relief</div>
                                <div className="text-base font-bold text-indigo-700">{monthlyReliefs.length} Slot Masa</div>
                            </div>
                            <div className="p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg">
                                <div className="text-[10px] font-semibold text-emerald-700 uppercase">Kadar Keberhasilan MMI</div>
                                <div className="text-base font-bold text-emerald-700">100% Terpelihara</div>
                            </div>
                        </div>

                        <div className="border p-3.5 rounded-xl bg-slate-50/50 space-y-2">
                            <h3 className="font-bold text-slate-900 text-xs flex items-center justify-between border-b pb-1.5">
                                <span className="text-indigo-900 flex items-center gap-1.5">
                                    📊 Carta Pai Analisa Jenis Ketidakhadiran Guru (Bulan {selectedMonth})
                                </span>
                                <span className="text-[10px] text-slate-500 font-normal">N = {monthlyAbsences.length} Kes Ketidakhadiran</span>
                            </h3>

                            {monthlyAbsences.length === 0 ? (
                                <p className="text-slate-400 text-center py-4 text-[11px]">Tiada rekod ketidakhadiran direkodkan pada bulan ini.</p>
                            ) : (
                                <div className="flex flex-col sm:flex-row items-center justify-around gap-4 py-1">
                                    <div className="w-28 h-28 relative flex-shrink-0">
                                        <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90">
                                            {pieChartPaths.map((slice, i) => (
                                                <path 
                                                    key={i} 
                                                    d={slice.pathData} 
                                                    fill={slice.color} 
                                                    stroke="#ffffff" 
                                                    strokeWidth="1.5"
                                                />
                                            ))}
                                        </svg>
                                    </div>
                                    <div className="grid grid-cols-2 gap-x-4 gap-y-1.5 text-[11px] flex-1">
                                        {leaveTypeStats.map((st, i) => (
                                            <div key={i} className="flex items-center justify-between bg-white p-1.5 rounded border border-slate-200">
                                                <div className="flex items-center gap-1.5 truncate">
                                                    <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: st.color }}></span>
                                                    <span className="truncate font-medium text-slate-700">{st.type}</span>
                                                </div>
                                                <span className="font-bold text-slate-900 ml-2">{st.percentage}% <span className="text-[10px] font-normal text-slate-400">({st.count})</span></span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="border p-3 rounded-xl space-y-2 bg-slate-50/50">
                                <h3 className="font-bold text-slate-900 text-[11px] flex items-center justify-between border-b pb-1">
                                    <span className="text-indigo-800 flex items-center gap-1">
                                        🏆 5 Guru Relief Tertinggi
                                    </span>
                                </h3>
                                <div className="space-y-1.5">
                                    {top5Highest.length === 0 ? (
                                        <p className="text-slate-400 text-[10px]">Tiada rekod relief pada bulan ini.</p>
                                    ) : top5Highest.map((t, idx) => (
                                        <div key={t.name} className="flex items-center justify-between bg-white p-1.5 border rounded text-[11px]">
                                            <div className="flex items-center gap-1.5 truncate">
                                                <span className="w-4 h-4 bg-indigo-100 text-indigo-800 rounded-full font-bold flex items-center justify-center text-[9px] flex-shrink-0">
                                                    {idx + 1}
                                                </span>
                                                <div className="truncate">
                                                    <div className="font-semibold text-slate-800 truncate">{t.name}</div>
                                                </div>
                                            </div>
                                            <div className="font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-200 text-[10px] flex-shrink-0">
                                                {t.count} Slot
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="border p-3 rounded-xl space-y-2 bg-slate-50/50">
                                <h3 className="font-bold text-slate-900 text-[11px] flex items-center justify-between border-b pb-1">
                                    <span className="text-emerald-800 flex items-center gap-1">
                                        🌱 5 Guru Relief Paling Sedikit
                                    </span>
                                </h3>
                                <div className="space-y-1.5">
                                    {top5Lowest.length === 0 ? (
                                        <p className="text-slate-400 text-[10px]">Tiada rekod relief pada bulan ini.</p>
                                    ) : top5Lowest.map((t, idx) => (
                                        <div key={t.name} className="flex items-center justify-between bg-white p-1.5 border rounded text-[11px]">
                                            <div className="flex items-center gap-1.5 truncate">
                                                <span className="w-4 h-4 bg-emerald-100 text-emerald-800 rounded-full font-bold flex items-center justify-center text-[9px] flex-shrink-0">
                                                    {idx + 1}
                                                </span>
                                                <div className="truncate">
                                                    <div className="font-semibold text-slate-800 truncate">{t.name}</div>
                                                </div>
                                            </div>
                                            <div className="font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 text-[10px] flex-shrink-0">
                                                {t.count} Slot
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="border p-2.5 rounded-lg bg-amber-50/40 text-[10px] text-slate-700 space-y-0.5">
                            <span className="font-bold text-amber-900">Ulasan &amp; Status Pemeliharaan Masa Instruksional (MMI):</span>
                            <p>Semua waktu pengajaran guru yang bercuti/bertugas luar pada bulan ini telah berjaya diganti mengikut jadual MMI. Tiada kelas yang ditinggalkan tanpa pengawasan guru ganti.</p>
                        </div>

                        <div className="pt-4 grid grid-cols-3 gap-4 text-center text-[10px] border-t border-slate-300 print-break-inside-avoid">
                            <div>
                                <p className="text-slate-500">Disediakan Oleh:</p>
                                <div className="h-10"></div>
                                <p className="font-bold text-slate-900">({schoolInfo.coordinator || 'Penyelaras Relief MMI'})</p>
                                <p className="text-[9px] text-slate-400">Penyelaras Relief / Jawatankuasa MMI</p>
                            </div>

                            <div>
                                <p className="text-slate-500">Disemak Oleh:</p>
                                <div className="h-10"></div>
                                <p className="font-bold text-slate-900">({schoolInfo.pkAdmin || 'PK Pentadbiran'})</p>
                                <p className="text-[9px] text-slate-400">Penolong Kanan Pentadbiran</p>
                            </div>

                            <div>
                                <p className="text-slate-500">Disahkan Oleh:</p>
                                <div className="h-10"></div>
                                <p className="font-bold text-slate-900">({schoolInfo.headmaster || 'Pengetua / Guru Besar'})</p>
                                <p className="text-[9px] text-slate-400">Pengetua / Guru Besar</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 8. BULK WHATSAPP MODAL COMPONENT
        // ==========================================
        function BulkWhatsAppModal({ reliefs, teachers, schoolInfo, handleCloseModal }) {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayReliefs = reliefs.filter(r => r.date === todayStr && r.reliefTeacher && r.reliefTeacher !== "Sila Pilih Guru (Manual)");

            const groupedByTeacher = useMemo(() => {
                const map = {};
                todayReliefs.forEach(r => {
                    if (!map[r.reliefTeacher]) {
                        map[r.reliefTeacher] = [];
                    }
                    map[r.reliefTeacher].push(r);
                });
                return map;
            }, [todayReliefs]);

            const handleSendGroupWhatsApp = (teacherName, slots) => {
                const teacherObj = teachers.find(t => t.name === teacherName);
                if (!teacherObj || !teacherObj.phone) {
                    alert(`Nombor telefon untuk ${teacherName} tidak dijumpai!`);
                    return;
                }

                let phone = teacherObj.phone.replace(/[^0-9]/g, '');
                if (phone.startsWith('0')) phone = '6' + phone;

                let msg = `*NOTIFIKASI GURU GANTI (RELIEF MMI)*\n\n`;
                msg += `Assalam / Salam Sejahtera Cikgu *${teacherName}*,\n\n`;
                msg += `Berikut adalah senarai tugasan relief anda untuk hari ini (*${todayStr}*):\n\n`;

                slots.forEach((s, idx) => {
                    msg += `${idx + 1}. *${s.timeSlot}* (${s.slotNum})\n`;
                    msg += `   🏫 Kelas: *${s.class}*\n`;
                    msg += `   📚 Subjek: *${s.subject}*\n`;
                    msg += `   👤 Ganti: ${s.originalTeacher}\n\n`;
                });

                msg += `Mohon maklum & memelihara Masa Instruksional. Terima kasih!`;

                const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-xl max-w-xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
                        <div className="border-b pb-3 flex justify-between items-center">
                            <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                💬 Penghantaran Notifikasi WhatsApp Pukal ({todayStr})
                            </h3>
                            <button onClick={handleCloseModal} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                        </div>

                        <div className="overflow-y-auto flex-1 space-y-3 pr-1 text-xs">
                            {Object.keys(groupedByTeacher).length === 0 ? (
                                <p className="text-center text-slate-400 py-6">Tiada penetapan guru ganti untuk hari ini.</p>
                            ) : Object.keys(groupedByTeacher).map(tName => (
                                <div key={tName} className="p-3 bg-slate-50 border rounded-lg flex items-center justify-between">
                                    <div>
                                        <div className="font-bold text-slate-800 text-sm">{tName}</div>
                                        <div className="text-[11px] text-slate-500">{groupedByTeacher[tName].length} Slot Relief Ditetapkan</div>
                                    </div>
                                    <button 
                                        onClick={() => handleSendGroupWhatsApp(tName, groupedByTeacher[tName])}
                                        className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold flex items-center gap-1 text-xs shadow-sm"
                                    >
                                        💬 Hantar WA Guru Ini
                                    </button>
                                </div>
                            ))}
                        </div>

                        <div className="border-t pt-3 flex justify-end">
                            <button onClick={handleCloseModal} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold text-xs">
                                Tutup
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React App
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
